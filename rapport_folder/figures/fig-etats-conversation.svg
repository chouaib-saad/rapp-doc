<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="110 10 1280 980" width="1280" height="980">
<style><![CDATA[
text{font-family:Arial,Helvetica,sans-serif}
.sn{font-size:12.5px;font-weight:750;fill:#111111;text-anchor:middle}
.sd{font-size:11px;fill:#222222}
.sdc{font-size:11.5px;fill:#222222;text-anchor:middle}
.nt{font-size:10px;font-style:italic;fill:#555555;text-anchor:middle}
.gu{font-size:11px;fill:#333333;text-anchor:middle;paint-order:stroke;stroke:#FFFFFF;stroke-width:3.4;stroke-linejoin:round}
.gs{font-size:11px;fill:#333333;paint-order:stroke;stroke:#FFFFFF;stroke-width:3.4;stroke-linejoin:round}
.ge{font-size:11px;fill:#333333;text-anchor:end;paint-order:stroke;stroke:#FFFFFF;stroke-width:3.4;stroke-linejoin:round}
.st{stroke:#333333;stroke-width:1.5}
.sh{fill:#D0D0D0;opacity:0.55}
.sep{stroke:#333333;stroke-width:1.3}
.tr{fill:none;stroke:#333333;stroke-width:1.5}
]]></style>
<defs>
<marker id="ta" viewBox="0 0 10 10" refX="9.6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
</marker>
</defs>
<rect x="110" y="10" width="1280" height="980" fill="#FFFFFF"/>

<!-- ===================== TRANSITIONS ===================== -->

<!-- initial -> Session établie -->
<polyline class="tr" points="400,54 400,75" marker-end="url(#ta)"/>

<!-- Session établie -> Écoute -->
<polyline class="tr" points="400,130 400,205" marker-end="url(#ta)"/>
<text class="gs" x="410" y="172">[ouverture]</text>

<!-- Écoute -> Compréhension -->
<polyline class="tr" points="400,260 400,340" marker-end="url(#ta)"/>
<text class="gs" x="410" y="305">[fin de tour / transcription disponible]</text>

<!-- Compréhension -> Clarification -->
<polyline class="tr" points="485,350 690,350 690,270" marker-end="url(#ta)"/>
<text class="gu" x="590" y="343">[demande ambiguë]</text>
<text class="gu" x="590" y="367">/ demander une précision</text>

<!-- Clarification -> Écoute -->
<polyline class="tr" points="600,242 485,242" marker-end="url(#ta)"/>
<text class="gu" x="542" y="236">[précision obtenue]</text>

<!-- Compréhension -> Vérification d'identité -->
<polyline class="tr" points="485,385 810,385" marker-end="url(#ta)"/>
<text class="gu" x="750" y="378">[opération sensible]</text>

<!-- Compréhension -> Recherche documentaire -->
<polyline class="tr" points="400,395 400,490" marker-end="url(#ta)"/>
<text class="ge" x="390" y="445">[information requise]</text>

<!-- Compréhension -> Décision -->
<polyline class="tr" points="470,395 470,440 870,440 870,500" marker-end="url(#ta)"/>
<text class="gu" x="670" y="456">[action sans vérification]</text>

<!-- Vérification -> Décision -->
<polyline class="tr" points="930,410 930,500" marker-end="url(#ta)"/>
<text class="gs" x="938" y="460">[identité confirmée]</text>

<!-- Vérification -> Transférée -->
<polyline class="tr" points="1000,380 1330,380 1330,860" marker-end="url(#ta)"/>
<text class="gu" x="1165" y="373">[échec / expiration] / préparer le transfert</text>

<!-- Décision -> Exécution -->
<polyline class="tr" points="990,527 1110,527" marker-end="url(#ta)"/>
<text class="gu" x="1050" y="520">[verdict favorable]</text>

<!-- Décision -> Restitution -->
<polyline class="tr" points="900,555 900,722 510,722" marker-end="url(#ta)"/>
<text class="gu" x="705" y="715">[réponse informationnelle ou verdict défavorable]</text>

<!-- Exécution -> Restitution -->
<polyline class="tr" points="1190,555 1190,758 510,758" marker-end="url(#ta)"/>
<text class="gu" x="700" y="751">[opération terminée]</text>

<!-- Recherche documentaire -> Restitution -->
<polyline class="tr" points="400,570 400,690" marker-end="url(#ta)"/>
<text class="gs" x="410" y="635">[contexte récupéré]</text>

<!-- Restitution -> Écoute [tour suivant] (boucle interne) -->
<polyline class="tr" points="290,722 200,722 200,246 315,246" marker-end="url(#ta)"/>
<text class="gu" x="257" y="241">[tour suivant]</text>

<!-- Restitution -> Écoute [interruption du client] (boucle externe) -->
<polyline class="tr" points="290,758 165,758 165,222 315,222" marker-end="url(#ta)"/>
<text class="gu" x="240" y="216">[interruption du client]</text>

<!-- Restitution -> Résolue -->
<polyline class="tr" points="360,775 360,860" marker-end="url(#ta)"/>
<text class="ge" x="352" y="822">[demande satisfaite]</text>

<!-- Restitution -> Transférée -->
<polyline class="tr" points="490,775 490,820 1260,820 1260,860" marker-end="url(#ta)"/>
<text class="gu" x="880" y="813">[escalade nécessaire] / préparer le transfert</text>

<!-- Résolue -> final -->
<polyline class="tr" points="360,905 360,939" marker-end="url(#ta)"/>

<!-- Transférée -> final -->
<polyline class="tr" points="1280,905 1280,939" marker-end="url(#ta)"/>

<!-- ===================== PSEUDO-ÉTAT INITIAL ===================== -->
<circle cx="400" cy="45" r="9" fill="#111111"/>

<!-- ===================== ÉTATS ===================== -->

<!-- Session établie -->
<rect class="sh" x="318" y="78" width="170" height="55" rx="8"/>
<rect class="st" x="315" y="75" width="170" height="55" rx="8" fill="#96D5F2"/>
<line class="sep" x1="315" y1="97" x2="485" y2="97"/>
<text class="sn" x="400" y="91">Session établie</text>
<text class="sdc" x="400" y="116">Initialiser le contexte</text>

<!-- Écoute -->
<rect class="sh" x="318" y="208" width="170" height="55" rx="8"/>
<rect class="st" x="315" y="205" width="170" height="55" rx="8" fill="#96D5F2"/>
<line class="sep" x1="315" y1="227" x2="485" y2="227"/>
<text class="sn" x="400" y="221">Écoute</text>
<text class="sdc" x="400" y="246">Recevoir le tour vocal</text>

<!-- Compréhension -->
<rect class="sh" x="318" y="343" width="170" height="55" rx="8"/>
<rect class="st" x="315" y="340" width="170" height="55" rx="8" fill="#96D5F2"/>
<line class="sep" x1="315" y1="362" x2="485" y2="362"/>
<text class="sn" x="400" y="356">Compréhension</text>
<text class="sdc" x="400" y="381">Interpréter l'intention</text>

<!-- Clarification -->
<rect class="sh" x="603" y="218" width="180" height="55" rx="8"/>
<rect class="st" x="600" y="215" width="180" height="55" rx="8" fill="#FCFBD9"/>
<line class="sep" x1="600" y1="237" x2="780" y2="237"/>
<text class="sn" x="690" y="231">Clarification</text>
<text class="sdc" x="690" y="256">Demander une précision</text>

<!-- Recherche documentaire -->
<rect class="sh" x="303" y="493" width="200" height="80" rx="8"/>
<rect class="st" x="300" y="490" width="200" height="80" rx="8" fill="#96D5F2"/>
<line class="sep" x1="300" y1="512" x2="500" y2="512"/>
<text class="sn" x="400" y="506">Recherche documentaire</text>
<text class="sdc" x="400" y="530">Rechercher les preuves</text>
<text class="sdc" x="400" y="544">documentaires pertinentes</text>

<!-- Vérification d'identité -->
<rect class="sh" x="813" y="353" width="190" height="60" rx="8"/>
<rect class="st" x="810" y="350" width="190" height="60" rx="8" fill="#F4A6A6"/>
<line class="sep" x1="810" y1="372" x2="1000" y2="372"/>
<text class="sn" x="905" y="366">Vérification d'identité</text>
<text class="sdc" x="905" y="389">Contrôler l'identité</text>

<!-- Décision -->
<rect class="sh" x="813" y="503" width="180" height="55" rx="8"/>
<rect class="st" x="810" y="500" width="180" height="55" rx="8" fill="#FCFBD9"/>
<line class="sep" x1="810" y1="522" x2="990" y2="522"/>
<text class="sn" x="900" y="516">Décision</text>
<text class="sdc" x="900" y="541">Évaluer les règles métier</text>

<!-- Exécution -->
<rect class="sh" x="1113" y="503" width="160" height="55" rx="8"/>
<rect class="st" x="1110" y="500" width="160" height="55" rx="8" fill="#96D5F2"/>
<line class="sep" x1="1110" y1="522" x2="1270" y2="522"/>
<text class="sn" x="1190" y="516">Exécution</text>
<text class="sdc" x="1190" y="541">Réaliser l'opération</text>

<!-- Restitution -->
<rect class="sh" x="293" y="693" width="220" height="85" rx="8"/>
<rect class="st" x="290" y="690" width="220" height="85" rx="8" fill="#96D5F2"/>
<line class="sep" x1="290" y1="712" x2="510" y2="712"/>
<text class="sn" x="400" y="706">Restitution</text>
<text class="sdc" x="400" y="732">Produire et transmettre</text>
<text class="sdc" x="400" y="747">la réponse au client</text>

<!-- Résolue -->
<rect class="sh" x="283" y="863" width="160" height="45" rx="8"/>
<rect class="st" x="280" y="860" width="160" height="45" rx="8" fill="#CDF2CD"/>
<text class="sn" x="360" y="887">Résolue</text>

<!-- Transférée -->
<rect class="sh" x="1203" y="863" width="160" height="45" rx="8"/>
<rect class="st" x="1200" y="860" width="160" height="45" rx="8" fill="#CDF2CD"/>
<text class="sn" x="1280" y="887">Transférée</text>

<!-- ===================== PSEUDO-ÉTATS FINAUX ===================== -->
<circle cx="360" cy="950" r="11" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
<circle cx="360" cy="950" r="6.5" fill="#111111"/>

<circle cx="1280" cy="950" r="11" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
<circle cx="1280" cy="950" r="6.5" fill="#111111"/>

</svg>
