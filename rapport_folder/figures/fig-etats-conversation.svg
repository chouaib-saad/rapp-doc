<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="30 20 1220 1000" width="1220" height="1000">
<style><![CDATA[
.nn{font-size:12.5px;font-weight:600;fill:#111111;text-anchor:middle;font-family:Arial,Helvetica,sans-serif}
.ed{font-size:11.5px;font-weight:600;fill:#333333;text-anchor:middle;paint-order:stroke;stroke:#FFFFFF;stroke-width:3.4;stroke-linejoin:round;font-family:Arial,Helvetica,sans-serif}
.es{font-size:11.5px;font-weight:600;fill:#333333;paint-order:stroke;stroke:#FFFFFF;stroke-width:3.4;stroke-linejoin:round;font-family:Arial,Helvetica,sans-serif}
.nd{stroke:#333333;stroke-width:1.2}
.fl{fill:none;stroke:#333333;stroke-width:1.3}
.ln{fill:none;stroke:#333333;stroke-width:1.2;stroke-dasharray:7,5}
.sl{font-size:16px;font-weight:790;fill:#111111;text-anchor:middle;font-family:Arial,Helvetica,sans-serif}
.sb{font-size:11.5px;font-weight:500;fill:#444444;text-anchor:middle;font-family:Arial,Helvetica,sans-serif}
.nt{font-size:11.5px;font-weight:500;fill:#333333;text-anchor:middle;font-family:Arial,Helvetica,sans-serif}
]]></style>

<defs>
<marker id="fa" viewBox="0 0 10 10" refX="9.6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
</marker>
</defs>

<rect x="30" y="20" width="1220" height="1000" fill="#FFFFFF"/>
<!-- ===================== ÉTATS ===================== -->

<!-- État initial -->
<circle cx="150" cy="116" r="11" fill="#333333"/>

<!-- Rangée 1 : trajet nominal -->
<rect class="nd" x="195" y="90" width="170" height="52" rx="12" ry="12" fill="#96D5F2"/>
<text class="nn" x="280" y="122">Session établie</text>

<rect class="nd" x="475" y="90" width="150" height="52" rx="12" ry="12" fill="#96D5F2"/>
<text class="nn" x="550" y="122">Écoute</text>

<rect class="nd" x="735" y="90" width="190" height="52" rx="12" ry="12" fill="#96D5F2"/>
<text class="nn" x="830" y="122">Compréhension</text>

<rect class="nd" x="1035" y="90" width="170" height="52" rx="12" ry="12" fill="#96D5F2"/>
<text class="nn" x="1120" y="122">Clarification</text>

<!-- Rangée 2 : recherche, contrôle, décision, exécution -->
<rect class="nd" x="1040" y="330" width="170" height="52" rx="12" ry="12" fill="#96D5F2"/>
<text class="nn" x="1125" y="352">Recherche</text>
<text class="nn" x="1125" y="368">documentaire</text>

<rect class="nd" x="735" y="330" width="190" height="52" rx="12" ry="12" fill="#96D5F2"/>
<text class="nn" x="830" y="352">Vérification</text>
<text class="nn" x="830" y="368">d'identité</text>

<rect class="nd" x="480" y="330" width="150" height="52" rx="12" ry="12" fill="#96D5F2"/>
<text class="nn" x="555" y="362">Décision</text>

<rect class="nd" x="195" y="330" width="160" height="52" rx="12" ry="12" fill="#96D5F2"/>
<text class="nn" x="275" y="362">Exécution</text>

<!-- Rangée 3 : restitution -->
<rect class="nd" x="390" y="620" width="200" height="52" rx="12" ry="12" fill="#96D5F2"/>
<text class="nn" x="490" y="652">Restitution</text>

<!-- Issues terminales -->
<rect class="nd" x="200" y="760" width="170" height="52" rx="12" ry="12" fill="#CDF2CD"/>
<text class="nn" x="285" y="792">Résolue</text>

<rect class="nd" x="950" y="760" width="170" height="52" rx="12" ry="12" fill="#CDF2CD"/>
<text class="nn" x="1035" y="792">Transférée</text>

<!-- États finaux -->
<circle class="nd" cx="285" cy="870" r="13" fill="#FFFFFF"/>
<circle cx="285" cy="870" r="7.5" fill="#333333"/>
<circle class="nd" cx="1035" cy="870" r="13" fill="#FFFFFF"/>
<circle cx="1035" cy="870" r="7.5" fill="#333333"/>

<!-- ===================== TRANSITIONS ===================== -->

<!-- Entrée -->
<polyline class="fl" points="161,116 195,116" marker-end="url(#fa)"/>

<!-- Trajet nominal -->
<polyline class="fl" points="365,116 475,116" marker-end="url(#fa)"/>
<text class="ed" x="420" y="108">ouverture</text>

<polyline class="fl" points="625,116 735,116" marker-end="url(#fa)"/>
<text class="ed" x="680" y="108">fin de tour</text>

<polyline class="fl" points="925,116 1035,116" marker-end="url(#fa)"/>
<text class="ed" x="980" y="108">demande ambiguë</text>

<!-- Clarification vers recherche -->
<polyline class="fl" points="1120,142 1120,330" marker-end="url(#fa)"/>
<text class="ed" x="1132" y="236" transform="rotate(-90 1132 236)">question</text>

<!-- Recherche vers contrôle d'identité -->
<polyline class="fl" points="1040,356 925,356" marker-end="url(#fa)"/>
<text class="ed" x="982" y="348">passages</text>

<!-- Court-circuit par la vérification d'identité -->
<polyline class="fl" points="830,142 830,330" marker-end="url(#fa)"/>
<text class="ed" x="842" y="236" transform="rotate(-90 842 236)">opération sensible</text>

<polyline class="fl" points="735,356 630,356" marker-end="url(#fa)"/>
<text class="ed" x="682" y="348">identité fraîche</text>

<polyline class="fl" points="480,356 355,356" marker-end="url(#fa)"/>
<text class="ed" x="417" y="348">verdict favorable</text>

<!-- Exécution vers restitution -->
<polyline class="fl" points="275,382 275,580 440,580 440,620" marker-end="url(#fa)"/>
<text class="ed" x="330" y="572">résultat</text>

<!-- Décision vers restitution -->
<polyline class="fl" points="555,382 555,620" marker-end="url(#fa)"/>
<text class="es" x="563" y="500">réponse</text>

<!-- Reprise : tour suivant -->
<polyline class="fl" points="390,646 60,646 60,50 420,50 420,110 475,110" marker-end="url(#fa)"/>
<text class="ed" x="240" y="42">tour suivant</text>

<!-- Reprise : interruption du client -->
<polyline class="fl" points="590,646 655,646 655,122 625,122" marker-end="url(#fa)"/>
<text class="ed" x="670" y="560" transform="rotate(-90 670 560)">interruption du client</text>

<!-- Sorties terminales -->
<polyline class="fl" points="440,672 440,720 285,720 285,760" marker-end="url(#fa)"/>
<text class="ed" x="362" y="712">demande satisfaite</text>

<polyline class="fl" points="540,672 540,720 990,720 990,760" marker-end="url(#fa)"/>
<text class="ed" x="760" y="712">escalade</text>

<!-- Échec de la vérification d'identité -->
<polyline class="fl" points="830,382 830,690 1080,690 1080,760" marker-end="url(#fa)"/>
<text class="ed" x="955" y="682">échec de vérification</text>

<!-- Vers les états finaux -->
<polyline class="fl" points="285,812 285,857" marker-end="url(#fa)"/>
<polyline class="fl" points="1035,812 1035,857" marker-end="url(#fa)"/>

<!-- ===================== NOTE ===================== -->
<rect class="ln" x="330" y="915" width="900" height="62" rx="10" ry="10" fill="#F7F7F7"/>
<text class="nt" x="780" y="942">Les deux issues sont terminales et traitées symétriquement : l'escalade est un résultat</text>
<text class="nt" x="780" y="960">normal du système, pas une défaillance.</text>
</svg>
