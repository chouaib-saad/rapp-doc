<svg xmlns="http://www.w3.org/2000/svg" width="915" height="480" viewBox="35 35 915 480">
  <rect x="0" y="0" width="1000" height="1000" fill="#FFFFFF"/>

  <!-- HEADER MOIS -->
  <g>
    <rect x="192" y="46" width="124" height="26" fill="#D8E5F1"/>
    <rect x="316" y="46" width="124" height="26" fill="#D8E5F1"/>
    <rect x="440" y="46" width="124" height="26" fill="#D8E5F1"/>
    <rect x="564" y="46" width="124" height="26" fill="#D8E5F1"/>
    <rect x="688" y="46" width="124" height="26" fill="#D8E5F1"/>
    <rect x="812" y="46" width="124" height="26" fill="#D8E5F1"/>
    <g text-anchor="middle" dominant-baseline="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" fill="#5A6D7E" letter-spacing="0.4">
      <text x="254" y="59">MARS</text>
      <text x="378" y="59">AVRIL</text>
      <text x="502" y="59">MAI</text>
      <text x="626" y="59">JUIN</text>
      <text x="750" y="59">JUILLET</text>
      <text x="874" y="59">AOÛT</text>
    </g>
  </g>

  <!-- HEADER S1 / S2 -->
  <g>
    <rect x="192" y="73" width="62" height="18" fill="#E8F1F8"/>
    <rect x="254" y="73" width="62" height="18" fill="#D8E5F1"/>
    <rect x="316" y="73" width="62" height="18" fill="#E8F1F8"/>
    <rect x="378" y="73" width="62" height="18" fill="#D8E5F1"/>
    <rect x="440" y="73" width="62" height="18" fill="#E8F1F8"/>
    <rect x="502" y="73" width="62" height="18" fill="#D8E5F1"/>
    <rect x="564" y="73" width="62" height="18" fill="#E8F1F8"/>
    <rect x="626" y="73" width="62" height="18" fill="#D8E5F1"/>
    <rect x="688" y="73" width="62" height="18" fill="#E8F1F8"/>
    <rect x="750" y="73" width="62" height="18" fill="#D8E5F1"/>
    <rect x="812" y="73" width="62" height="18" fill="#E8F1F8"/>
    <rect x="874" y="73" width="62" height="18" fill="#D8E5F1"/>
