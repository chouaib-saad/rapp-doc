      <text x="285" y="82">S2</text>
      <text x="347" y="82">S1</text>
      <text x="409" y="82">S2</text>
      <text x="471" y="82">S1</text>
      <text x="533" y="82">S2</text>
      <text x="595" y="82">S1</text>
      <text x="657" y="82">S2</text>
      <text x="719" y="82">S1</text>
      <text x="781" y="82">S2</text>
      <text x="843" y="82">S1</text>
      <text x="905" y="82">S2</text>
    </g>
  </g>

  <!-- LIGNES GRILLE -->
  <g stroke="#CFCFCF" stroke-width="1">
    <line x1="192" y1="112" x2="936" y2="112"/>
    <line x1="192" y1="143" x2="936" y2="143"/>
    <line x1="192" y1="174" x2="936" y2="174"/>
    <line x1="192" y1="213" x2="936" y2="213"/>
    <line x1="192" y1="244" x2="936" y2="244"/>
    <line x1="192" y1="275" x2="936" y2="275"/>
    <line x1="192" y1="306" x2="936" y2="306"/>
    <line x1="192" y1="345" x2="936" y2="345"/>
    <line x1="192" y1="376" x2="936" y2="376"/>
    <line x1="192" y1="407" x2="936" y2="407"/>
    <line x1="192" y1="446" x2="936" y2="446"/>
    <line x1="192" y1="477" x2="936" y2="477"/>
  </g>

  <!-- CATEGORIES VERTICALES -->
  <g font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#333333">
