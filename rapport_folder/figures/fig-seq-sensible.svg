<svg xmlns="http://www.w3.org/2000/svg" width="1780" height="1610" viewBox="0 0 1780 1610">
<rect width="1780" height="1610" fill="#FFFFFF"/>
<defs>
<style>
text{font-family:Arial,Helvetica,sans-serif;}
.plab{font-size:12px;font-weight:bold;fill:#333333;text-anchor:middle;}
.pst{font-size:10px;font-style:italic;fill:#555555;text-anchor:middle;}
.bname{font-size:12px;font-weight:bold;fill:#222222;text-anchor:middle;dominant-baseline:middle;}
.mlab{font-size:12px;fill:#222222;text-anchor:middle;}
.mlabL{font-size:12px;fill:#222222;}
.fword{font-size:12px;font-weight:bold;fill:#111111;}
.fcond{font-size:11px;font-style:italic;fill:#111111;}
.bg{fill:#FFFFFF;}
.life{fill:none;stroke:#D02A50;stroke-width:1;stroke-dasharray:5,4;}
.act{fill:none;stroke:#D02A50;stroke-width:1.7;}
.pB{fill:#96D5F2;stroke:#D02A50;stroke-width:1.3;}
.pG{fill:#CDF2CD;stroke:#D02A50;stroke-width:1.3;}
.pL{fill:#E8D5F5;stroke:#D02A50;stroke-width:1.3;}
.dbbody{fill:#FFB340;stroke:#C77800;stroke-width:1.3;}
.dbtop{fill:#FFC466;stroke:#C77800;stroke-width:1.3;}
.actbar{fill:#d8d8d8;stroke:#333333;stroke-width:1;}
.msg{fill:none;stroke:#D02A50;stroke-width:1.4;}
.msgR{fill:none;stroke:#2EA843;stroke-width:1.4;stroke-dasharray:7,5;}
.frag{fill:none;stroke:#D02A50;stroke-width:1.3;}
.ftab{fill:#f1a7c1;stroke:#D02A50;stroke-width:1.1;}
.ftabN{fill:#F0F4F8;stroke:#D02A50;stroke-width:1.1;}
.sep{stroke:#D02A50;stroke-width:1.1;stroke-dasharray:6,5;}
</style>
<filter id="ds" x="-30%" y="-30%" width="160%" height="160%">
<feDropShadow dx="3" dy="3" stdDeviation="2" flood-color="#8A8A8A" flood-opacity="0.45"/>
</filter>
<marker id="mM" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#D02A50"/></marker>
<marker id="mGo" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#2EA843" stroke-width="1.6"/></marker>
<marker id="mSelf" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#D02A50"/></marker>
</defs>

<!-- ===================== LIFELINES ===================== -->
<path d="M90 132 L90 1494" class="life"/>
<path d="M370 132 L370 1494" class="life"/>
