<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1520" height="1920" viewBox="0 0 1520 1920" font-family="Arial, Helvetica, sans-serif">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10"
            markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0.8 L 9.5 5 L 0 9.2 Z" fill="#0E6655"/>
    </marker>
    <g id="cicon" fill="#FFFFFF" stroke="#2C3E50" stroke-width="1.4">
      <rect x="0" y="3" width="7" height="4"/>
      <rect x="0" y="10" width="7" height="4"/>
      <rect x="5" y="0" width="22" height="17"/>
    </g>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;}
      .nt{font-size:16px;font-weight:bold;fill:#1B2631;}
      .st{font-size:11.5px;font-style:italic;font-weight:bold;fill:#5D6D7E;}
      .cn{font-size:14px;font-weight:bold;fill:#1B2631;}
      .cs{font-size:11.5px;font-style:italic;font-weight:bold;fill:#5D6D7E;}
      .sm{font-size:11.5px;font-weight:bold;fill:#1B2631;}
      .pt{font-size:13px;font-weight:bold;font-style:italic;fill:#1B2631;}
      .lbl{font-size:11.5px;font-style:italic;font-weight:bold;fill:#154360;
           paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round;}
      .node{fill:#F7F9FB;stroke:#0A3B2E;stroke-width:3.2;}
      .comp{fill:#FFFFFF;stroke:#2C3E50;stroke-width:2.4;}
      .pkg{fill:#FCF3CF;stroke:#9A7D0A;stroke-width:2.2;}
      .db{fill:#E8F4F8;stroke:#1F618D;stroke-width:2.4;}
      .q{fill:#FDEBD0;stroke:#BA4A00;stroke-width:2.4;}
      .link{fill:none;stroke:#0E6655;stroke-width:2;stroke-linejoin:round;stroke-linecap:round;}
      .device{fill:#FFFFFF;stroke:#0A3B2E;stroke-width:3;}
    </style>
  </defs>

  <rect x="0" y="0" width="1520" height="1920" fill="#FFFFFF"/>

  <!-- ================= APPAREILS ================= -->
  <g>
    <rect x="280" y="40" width="300" height="90" rx="6" class="device"/>
    <text x="430" y="80" text-anchor="middle" class="cn">Appareil de l'Abonné</text>
    <text x="430" y="100" text-anchor="middle" class="st">&lt;&lt;appareil&gt;&gt;</text>
  </g>
  <g>
    <rect x="920" y="40" width="300" height="90" rx="6" class="device"/>
    <text x="1070" y="80" text-anchor="middle" class="cn">Poste de Travail Administrateur</text>
    <text x="1070" y="100" text-anchor="middle" class="st">&lt;&lt;appareil&gt;&gt;</text>
  </g>

  <!-- ================= COUCHE CLIENTE ================= -->
  <rect x="110" y="220" width="1280" height="170" rx="6" class="node"/>
  <text x="750" y="250" text-anchor="middle" class="nt">Couche Cliente</text>
  <text x="750" y="270" text-anchor="middle" class="st">&lt;&lt;environnement d'exécution&gt;&gt;</text>

  <rect x="170" y="300" width="520" height="70" rx="4" class="comp"/>
  <use xlink:href="#cicon" href="#cicon" x="658" y="307"/>
  <text x="430" y="330" text-anchor="middle" class="cn">Portail Web de l'Abonné</text>
  <text x="430" y="350" text-anchor="middle" class="cs">&lt;&lt;React / WebRTC&gt;&gt;</text>

  <rect x="810" y="300" width="520" height="70" rx="4" class="comp"/>
  <use xlink:href="#cicon" href="#cicon" x="1298" y="307"/>
  <text x="1070" y="330" text-anchor="middle" class="cn">Console Admin &amp; Supervision</text>
  <text x="1070" y="350" text-anchor="middle" class="cs">&lt;&lt;React / HTTPS&gt;&gt;</text>

  <!-- ================= COUCHE PÉRIPHÉRIQUE ================= -->
  <rect x="110" y="480" width="1280" height="180" rx="6" class="node"/>
  <text x="750" y="510" text-anchor="middle" class="nt">Couche Périphérique &amp; Ingress</text>
  <text x="750" y="530" text-anchor="middle" class="st">&lt;&lt;DMZ / Public&gt;&gt;</text>

  <rect x="160" y="565" width="350" height="70" rx="4" class="comp"/>
  <use xlink:href="#cicon" href="#cicon" x="478" y="572"/>
  <text x="335" y="594" text-anchor="middle" class="cn">Passerelle API &amp; Ingress</text>
  <text x="335" y="614" text-anchor="middle" class="cs">&lt;&lt;Proxy Inverse / TLS&gt;&gt;</text>

  <rect x="575" y="565" width="350" height="70" rx="4" class="comp"/>
  <use xlink:href="#cicon" href="#cicon" x="893" y="572"/>
  <text x="750" y="594" text-anchor="middle" class="cn">Média SFU Temps Réel</text>
  <text x="750" y="614" text-anchor="middle" class="cs">&lt;&lt;LiveKit / WebRTC&gt;&gt;</text>

  <rect x="990" y="565" width="350" height="70" rx="4" class="comp"/>
  <use xlink:href="#cicon" href="#cicon" x="1308" y="572"/>
  <text x="1165" y="594" text-anchor="middle" class="cn">Passerelle Téléphonique</text>
  <text x="1165" y="614" text-anchor="middle" class="cs">&lt;&lt;SIP / RTP&gt;&gt;</text>

  <!-- ================= CLUSTER D'APPLICATION ================= -->
  <rect x="55" y="750" width="1390" height="570" rx="6" class="node"/>
  <text x="750" y="780" text-anchor="middle" class="nt">Cluster d'Application</text>
  <text x="750" y="800" text-anchor="middle" class="st">&lt;&lt;orchestration de conteneurs&gt;&gt;</text>

  <!-- Package: Plan d'Orchestration Agentique -->
  <rect x="95" y="825" width="240" height="18" class="pkg"/>
  <rect x="95" y="843" width="590" height="175" rx="3" class="pkg"/>
  <text x="107" y="839" class="pt">Plan d'Orchestration Agentique</text>

  <rect x="125" y="890" width="250" height="90" rx="4" class="comp"/>
  <use xlink:href="#cicon" href="#cicon" x="343" y="897"/>
  <text x="250" y="925" text-anchor="middle" class="cn">Processus Worker Agents</text>
  <text x="250" y="945" text-anchor="middle" class="cs">&lt;&lt;Stateful / Python&gt;&gt;</text>

  <rect x="425" y="890" width="240" height="90" rx="4" class="comp"/>
  <use xlink:href="#cicon" href="#cicon" x="633" y="897"/>
  <text x="545" y="925" text-anchor="middle" class="cn">Assembleur Temps Réel</text>
  <text x="545" y="945" text-anchor="middle" class="cs">&lt;&lt;Boucle d'Événements&gt;&gt;</text>

  <!-- Package: Plan d'Intégration -->
  <rect x="730" y="825" width="150" height="18" class="pkg"/>
  <rect x="730" y="843" width="700" height="175" rx="3" class="pkg"/>
  <text x="742" y="839" class="pt">Plan d'Intégration</text>
  <text x="895" y="839" class="cs">&lt;&lt;Passerelles MCP&gt;&gt;</text>

  <rect x="755" y="895" width="200" height="85" rx="4" class="comp"/>
  <use xlink:href="#cicon" href="#cicon" x="923" y="902"/>
  <text x="855" y="943" text-anchor="middle" class="cn">Passerelle de Support IT</text>

  <rect x="985" y="895" width="200" height="85" rx="4" class="comp"/>
  <use xlink:href="#cicon" href="#cicon" x="1153" y="902"/>
  <text x="1085" y="943" text-anchor="middle" class="cn">Passerelle Métier Télécom</text>

  <rect x="1215" y="895" width="200" height="85" rx="4" class="comp"/>
  <use xlink:href="#cicon" href="#cicon" x="1383" y="902"/>
  <text x="1315" y="943" text-anchor="middle" class="cn">Service de Notifications</text>

  <!-- Package: Services Domaine Métier -->
  <rect x="95" y="1070" width="210" height="18" class="pkg"/>
  <rect x="95" y="1088" width="1335" height="190" rx="3" class="pkg"/>
  <text x="107" y="1084" class="pt">Services Domaine Métier</text>
  <text x="320" y="1084" class="cs">&lt;&lt;Stateless / Hexagonal&gt;&gt;</text>

  <rect x="125" y="1140" width="290" height="105" rx="4" class="comp"/>
  <use xlink:href="#cicon" href="#cicon" x="383" y="1147"/>
  <text x="270" y="1198" text-anchor="middle" class="cn">Contexte &amp; Identité</text>

  <rect x="455" y="1140" width="290" height="105" rx="4" class="comp"/>
  <use xlink:href="#cicon" href="#cicon" x="713" y="1147"/>
  <text x="600" y="1188" text-anchor="middle" class="cn">Connaissance &amp; RAG</text>
  <text x="600" y="1208" text-anchor="middle" class="sm">(Service Interne)</text>

  <rect x="785" y="1140" width="290" height="105" rx="4" class="comp"/>
  <use xlink:href="#cicon" href="#cicon" x="1043" y="1147"/>
  <text x="930" y="1198" text-anchor="middle" class="cn">Moteur de Décision</text>

  <rect x="1115" y="1140" width="290" height="105" rx="4" class="comp"/>
  <use xlink:href="#cicon" href="#cicon" x="1373" y="1147"/>
  <text x="1260" y="1198" text-anchor="middle" class="cn">Exécution &amp; Audit</text>

  <!-- ================= COUCHE DONNÉES ================= -->
  <rect x="55" y="1410" width="1390" height="210" rx="6" class="node"/>
  <text x="750" y="1440" text-anchor="middle" class="nt">Couche Données &amp; Persistance</text>
  <text x="750" y="1460" text-anchor="middle" class="st">&lt;&lt;réseau de stockage isolé&gt;&gt;</text>

  <path d="M 140 1490 L 140 1578 A 95 12 0 0 0 330 1578 L 330 1490 Z" class="db"/>
  <ellipse cx="235" cy="1490" rx="95" ry="12" class="db"/>
  <text x="235" y="1525" text-anchor="middle" class="cn">Stockage Relationnel</text>
  <text x="235" y="1543" text-anchor="middle" class="cs">&lt;&lt;PostgreSQL&gt;&gt;</text>
  <text x="235" y="1561" text-anchor="middle" class="sm">[Source de Vérité]</text>

  <path d="M 385 1490 L 385 1578 A 95 12 0 0 0 575 1578 L 575 1490 Z" class="db"/>
  <ellipse cx="480" cy="1490" rx="95" ry="12" class="db"/>
  <text x="480" y="1525" text-anchor="middle" class="cn">Index Vectoriel</text>
  <text x="480" y="1543" text-anchor="middle" class="cs">&lt;&lt;Qdrant&gt;&gt;</text>
  <text x="480" y="1561" text-anchor="middle" class="sm">[Sémantique/Lexical]</text>

  <path d="M 630 1490 L 630 1578 A 95 12 0 0 0 820 1578 L 820 1490 Z" class="db"/>
  <ellipse cx="725" cy="1490" rx="95" ry="12" class="db"/>
  <text x="725" y="1525" text-anchor="middle" class="cn">Stockage Objet</text>
  <text x="725" y="1543" text-anchor="middle" class="cs">&lt;&lt;MinIO&gt;&gt;</text>
  <text x="725" y="1561" text-anchor="middle" class="sm">[Corpus Documentaire]</text>

  <path d="M 875 1490 L 875 1578 A 95 12 0 0 0 1065 1578 L 1065 1490 Z" class="db"/>
  <ellipse cx="970" cy="1490" rx="95" ry="12" class="db"/>
  <text x="970" y="1525" text-anchor="middle" class="cn">Cache en Mémoire</text>
  <text x="970" y="1543" text-anchor="middle" class="cs">&lt;&lt;Redis&gt;&gt;</text>
  <text x="970" y="1561" text-anchor="middle" class="sm">[État Éphémère]</text>

  <path d="M 1120 1478 L 1360 1478 Q 1400 1478 1400 1498 L 1400 1578 Q 1400 1598 1360 1598 L 1120 1598 Q 1134 1568 1120 1538 Q 1106 1508 1120 1478 Z" class="q"/>
  <path d="M 1120 1478 Q 1136 1538 1120 1598" fill="none" stroke="#BA4A00" stroke-width="1.6" opacity="0.7"/>
  <text x="1258" y="1528" text-anchor="middle" class="cn">Bus d'Événements</text>
  <text x="1258" y="1548" text-anchor="middle" class="cs">&lt;&lt;Découplage Asynchrone&gt;&gt;</text>

  <!-- ================= SYSTÈMES EXTERNES ================= -->
  <rect x="55" y="1730" width="1390" height="150" rx="6" class="node"/>
  <text x="750" y="1757" text-anchor="middle" class="nt">Systèmes d'Entreprise Externes</text>
  <text x="750" y="1775" text-anchor="middle" class="st">&lt;&lt;externe&gt;&gt;</text>

  <rect x="100" y="1790" width="380" height="75" rx="4" class="comp"/>
  <use xlink:href="#cicon" href="#cicon" x="448" y="1797"/>
  <text x="290" y="1822" text-anchor="middle" class="cn">Système d'Opérations Télécom</text>
  <text x="290" y="1843" text-anchor="middle" class="sm">(Facturation, Approvisionnement)</text>

  <rect x="560" y="1790" width="380" height="75" rx="4" class="comp"/>
  <use xlink:href="#cicon" href="#cicon" x="908" y="1797"/>
  <text x="750" y="1822" text-anchor="middle" class="cn">Plateforme de Gestion de Tickets</text>
  <text x="750" y="1843" text-anchor="middle" class="sm">(GLPI)</text>

  <rect x="1020" y="1790" width="380" height="75" rx="4" class="comp"/>
  <use xlink:href="#cicon" href="#cicon" x="1368" y="1797"/>
  <text x="1210" y="1822" text-anchor="middle" class="cn">Fournisseurs d'IA &amp; LLM</text>
  <text x="1210" y="1843" text-anchor="middle" class="sm">(Llama, Deepgram, etc.)</text>

  <!-- ================= CONNEXIONS ================= -->
  <g marker-end="url(#arrow)">
    <!-- Appareils → Couche Cliente -->
    <path class="link" d="M 430 130 L 430 300"/>
    <path class="link" d="M 1070 130 L 1070 300"/>

    <!-- Client → Périphérique -->
    <path class="link" d="M 430 370 L 430 420 L 335 420 L 335 565"/>
    <path class="link" d="M 1070 370 L 1070 445 L 370 445 L 370 565"/>
    <path class="link" marker-start="url(#arrow)" d="M 690 335 L 750 335 L 750 565"/>

    <!-- Téléphonie → SFU -->
    <path class="link" d="M 990 600 L 925 600"/>

    <!-- Périphérique → Cluster -->
    <path class="link" d="M 335 635 L 335 700 L 220 700 L 220 890"/>
    <path class="link" d="M 750 635 L 750 725 L 300 725 L 300 890"/>

    <!-- Worker → Assembleur -->
    <path class="link" d="M 375 935 L 425 935"/>

    <!-- Assembleur → Services Domaine -->
    <path class="link" d="M 545 980 L 545 1045 L 270 1045 L 270 1140"/>
    <path class="link" d="M 545 980 L 545 1045 L 570 1045 L 570 1140"/>
    <path class="link" d="M 545 980 L 545 1045 L 930 1045 L 930 1140"/>
    <path class="link" d="M 545 980 L 545 1045 L 1260 1045 L 1260 1140"/>

    <!-- Support IT → RAG -->
    <path class="link" d="M 755 937 L 700 937 L 700 1140"/>

    <!-- Décision → Exécution -->
    <path class="link" d="M 1075 1192 L 1115 1192"/>

    <!-- Exécution → Bus d'Événements -->
    <path class="link" d="M 1260 1245 L 1260 1478"/>

    <!-- Cluster → Données -->
    <path class="link" d="M 300 1245 L 300 1330 L 970 1330 L 970 1478"/>
    <path class="link" d="M 250 1245 L 250 1352 L 235 1352 L 235 1478"/>
    <path class="link" d="M 570 1245 L 570 1374 L 480 1374 L 480 1478"/>
    <path class="link" d="M 630 1245 L 630 1396 L 725 1396 L 725 1478"/>

    <!-- Bus → PostgreSQL -->
    <path class="link" d="M 1258 1598 L 1258 1638 L 235 1638 L 235 1592"/>

    <!-- ===== GOUTTIÈRES VERS SYSTÈMES EXTERNES (lanes séparées) ===== -->

    <!-- Passerelle Métier Télécom → Plateforme de Tickets
         sortie PAR LE BAS du composant, corridor libre y=1038, colonne x=1465 -->
    <path class="link" d="M 1085 980 L 1085 1038 L 1465 1038 L 1465 1660 L 750 1660 L 750 1790"/>

    <!-- Exécution &amp; Audit → Système d'Opérations Télécom : colonne x=1495, lane y=1692 -->
    <path class="link" d="M 1405 1192 L 1495 1192 L 1495 1692 L 290 1692 L 290 1790"/>

    <!-- Worker Agents → Fournisseurs d'IA : colonne x=25, lane y=1712 -->
    <path class="link" d="M 125 935 L 25 935 L 25 1712 L 1210 1712 L 1210 1790"/>
  </g>

  <!-- ================= LIBELLÉS ================= -->
  <text x="500" y="440" text-anchor="middle" class="lbl">&lt;&lt;HTTPS / REST&gt;&gt;</text>
  <text x="759" y="415" text-anchor="start" class="lbl">&lt;&lt;WebRTC / UDP&gt;&gt;</text>
  <text x="957" y="592" text-anchor="middle" class="lbl">&lt;&lt;Trunking SIP&gt;&gt;</text>
  <text x="268" y="694" text-anchor="middle" class="lbl">&lt;&lt;Routage Interne&gt;&gt;</text>
  <text x="525" y="719" text-anchor="middle" class="lbl">&lt;&lt;gRPC / Interne&gt;&gt;</text>
  <text x="712" y="1105" text-anchor="start" class="lbl">&lt;&lt;MCP / RAG&gt;&gt;</text>
  <text x="1095" y="1183" text-anchor="middle" class="lbl">&lt;&lt;API REST&gt;&gt;</text>
  <text x="1272" y="1390" text-anchor="start" class="lbl">&lt;&lt;Écriture Async&gt;&gt;</text>
  <text x="700" y="1632" text-anchor="middle" class="lbl">&lt;&lt;Écriture Async&gt;&gt;</text>
  <text x="1230" y="1032" text-anchor="middle" class="lbl">&lt;&lt;API REST / GLPI&gt;&gt;</text>
  <text x="1000" y="1654" text-anchor="middle" class="lbl">&lt;&lt;HTTPS / API&gt;&gt;</text>
  <text x="640" y="1686" text-anchor="middle" class="lbl">&lt;&lt;API Opérateur&gt;&gt;</text>
  <text x="450" y="1706" text-anchor="middle" class="lbl">&lt;&lt;HTTPS / Inférence&gt;&gt;</text>
</svg>
