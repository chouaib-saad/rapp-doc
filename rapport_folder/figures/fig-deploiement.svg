<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1500" height="1720" viewBox="0 0 1500 1720" font-family="Arial, Helvetica, sans-serif">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10"
            markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0.8 L 9.5 5 L 0 9.2 Z" fill="#2C3E50"/>
    </marker>
    <g id="cicon" fill="#FFFFFF" stroke="#34495E" stroke-width="1">
      <rect x="0" y="3" width="7" height="4"/>
      <rect x="0" y="10" width="7" height="4"/>
      <rect x="5" y="0" width="22" height="17"/>
    </g>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;}
      .title{font-size:19px;font-weight:bold;fill:#2C3E50;}
      .nt{font-size:14px;font-weight:bold;fill:#2C3E50;}
      .st{font-size:11px;font-style:italic;fill:#7F8C8D;}
      .cn{font-size:14px;font-weight:bold;fill:#2C3E50;}
      .cs{font-size:11px;font-style:italic;fill:#7F8C8D;}
      .sm{font-size:11px;font-weight:bold;fill:#2C3E50;}
      .pt{font-size:14px;font-weight:bold;font-style:italic;fill:#2C3E50;}
      .lbl{font-size:11px;font-style:italic;fill:#2C3E50;paint-order:stroke;stroke:#FFFFFF;stroke-width:3px;stroke-linejoin:round;}
      .node{fill:#F8F9FA;stroke:#0A3B2E;stroke-width:2.5;}
      .comp{fill:#FFFFFF;stroke:#34495E;stroke-width:1.5;}
      .pkg{fill:#FCF3CF;stroke:#B7950B;stroke-width:1.5;}
      .db{fill:#E8F4F8;stroke:#2980B9;stroke-width:1.5;}
      .q{fill:#FDEBD0;stroke:#D35400;stroke-width:1.5;}
      .link{fill:none;stroke:#117A65;stroke-width:1.75;}
      .device{fill:#FFFFFF;stroke:#0A3B2E;stroke-width:2;}
    </style>
  </defs>

  <!-- Fond blanc -->
  <rect x="0" y="0" width="1500" height="1720" fill="#FFFFFF"/>


  <!-- ================= APPAREILS (DEVICES) ================= -->
  <g>
    <rect x="180" y="60" width="280" height="110" rx="5" class="device"/>
    <text x="320" y="100" text-anchor="middle" class="cn">Appareil de l'Abonné</text>
    <text x="320" y="120" text-anchor="middle" class="st">&lt;&lt;appareil&gt;&gt;</text>
  </g>
  <g>
    <rect x="1040" y="60" width="280" height="110" rx="5" class="device"/>
    <text x="1180" y="100" text-anchor="middle" class="cn">Poste de Travail Administrateur</text>
    <text x="1180" y="120" text-anchor="middle" class="st">&lt;&lt;appareil&gt;&gt;</text>
  </g>

  <!-- ================= COUCHE CLIENTE ================= -->
  <rect x="150" y="210" width="1200" height="160" rx="5" class="node"/>
  <text x="750" y="234" text-anchor="middle" class="nt">Couche Cliente</text>
  <text x="750" y="252" text-anchor="middle" class="st">&lt;&lt;environnement d'exécution&gt;&gt;</text>

  <rect x="200" y="280" width="500" height="70" rx="4" class="comp"/>
  <use xlink:href="#cicon" href="#cicon" x="666" y="287"/>
  <text x="450" y="307" text-anchor="middle" class="cn">Portail Web de l'Abonné</text>
  <text x="450" y="327" text-anchor="middle" class="cs">&lt;&lt;React / WebRTC&gt;&gt;</text>

  <rect x="750" y="280" width="500" height="70" rx="4" class="comp"/>
  <use xlink:href="#cicon" href="#cicon" x="1216" y="287"/>
  <text x="1000" y="307" text-anchor="middle" class="cn">Console Admin &amp; Supervision</text>
  <text x="1000" y="327" text-anchor="middle" class="cs">&lt;&lt;React / HTTPS&gt;&gt;</text>

  <!-- ================= COUCHE PÉRIPHÉRIQUE & INGRESS ================= -->
  <rect x="150" y="430" width="1200" height="170" rx="5" class="node"/>
  <text x="750" y="454" text-anchor="middle" class="nt">Couche Périphérique &amp; Ingress</text>
  <text x="750" y="472" text-anchor="middle" class="st">&lt;&lt;DMZ / Public&gt;&gt;</text>

  <rect x="210" y="495" width="320" height="80" rx="4" class="comp"/>
  <use xlink:href="#cicon" href="#cicon" x="496" y="502"/>
  <text x="370" y="527" text-anchor="middle" class="cn">Passerelle API &amp; Ingress</text>
  <text x="370" y="549" text-anchor="middle" class="cs">&lt;&lt;Proxy Inverse / TLS&gt;&gt;</text>

  <rect x="590" y="495" width="320" height="80" rx="4" class="comp"/>
  <use xlink:href="#cicon" href="#cicon" x="876" y="502"/>
  <text x="750" y="527" text-anchor="middle" class="cn">Média SFU Temps Réel</text>
  <text x="750" y="549" text-anchor="middle" class="cs">&lt;&lt;LiveKit / WebRTC&gt;&gt;</text>

  <rect x="970" y="495" width="320" height="80" rx="4" class="comp"/>
  <use xlink:href="#cicon" href="#cicon" x="1256" y="502"/>
  <text x="1130" y="527" text-anchor="middle" class="cn">Passerelle Téléphonique</text>
  <text x="1130" y="549" text-anchor="middle" class="cs">&lt;&lt;SIP / RTP&gt;&gt;</text>

  <!-- ================= CLUSTER D'APPLICATION ================= -->
  <rect x="100" y="660" width="1300" height="490" rx="5" class="node"/>
  <text x="750" y="684" text-anchor="middle" class="nt">Cluster d'Application</text>
  <text x="750" y="702" text-anchor="middle" class="st">&lt;&lt;orchestration de conteneurs / K8s&gt;&gt;</text>

  <!-- Package: Plan d'Orchestration Agentique -->
  <rect x="140" y="712" width="170" height="14" class="pkg"/>
  <rect x="140" y="725" width="560" height="180" rx="3" class="pkg"/>
  <text x="152" y="749" class="pt">Plan d'Orchestration Agentique</text>

  <rect x="165" y="772" width="245" height="85" rx="4" class="comp"/>
  <use xlink:href="#cicon" href="#cicon" x="376" y="779"/>
  <text x="287" y="804" text-anchor="middle" class="cn">Processus Worker Agents</text>
  <text x="287" y="825" text-anchor="middle" class="cs">&lt;&lt;Stateful / Python&gt;&gt;</text>

  <rect x="435" y="772" width="240" height="85" rx="4" class="comp"/>
  <use xlink:href="#cicon" href="#cicon" x="641" y="779"/>
  <text x="555" y="804" text-anchor="middle" class="cn">Assembleur Temps Réel</text>
  <text x="555" y="825" text-anchor="middle" class="cs">&lt;&lt;Boucle d'Événements&gt;&gt;</text>

  <!-- Package: Plan d'Intégration MCP -->
  <rect x="740" y="712" width="140" height="14" class="pkg"/>
  <rect x="740" y="725" width="620" height="180" rx="3" class="pkg"/>
  <text x="752" y="749" class="pt">Plan d'Intégration</text>
  <text x="752" y="767" class="cs">&lt;&lt;Passerelles MCP&gt;&gt;</text>

  <rect x="760" y="785" width="180" height="85" rx="4" class="comp"/>
  <use xlink:href="#cicon" href="#cicon" x="906" y="792"/>
  <text x="850" y="832" text-anchor="middle" class="cn">Passerelle de Support IT</text>

  <rect x="960" y="785" width="185" height="85" rx="4" class="comp"/>
  <use xlink:href="#cicon" href="#cicon" x="1111" y="792"/>
  <text x="1052" y="832" text-anchor="middle" class="cn">Passerelle Métier Télécom</text>

  <rect x="1165" y="785" width="180" height="85" rx="4" class="comp"/>
  <use xlink:href="#cicon" href="#cicon" x="1311" y="792"/>
  <text x="1255" y="832" text-anchor="middle" class="cn">Service de Notifications</text>

  <!-- Package: Services Domaine Métier -->
  <rect x="140" y="927" width="150" height="14" class="pkg"/>
  <rect x="140" y="940" width="1220" height="185" rx="3" class="pkg"/>
  <text x="152" y="964" class="pt">Services Domaine Métier</text>
  <text x="152" y="982" class="cs">&lt;&lt;Stateless / Hexagonal&gt;&gt;</text>

  <rect x="170" y="990" width="270" height="95" rx="4" class="comp"/>
  <use xlink:href="#cicon" href="#cicon" x="406" y="997"/>
  <text x="305" y="1043" text-anchor="middle" class="cn">Contexte &amp; Identité</text>

  <rect x="470" y="990" width="270" height="95" rx="4" class="comp"/>
  <use xlink:href="#cicon" href="#cicon" x="706" y="997"/>
  <text x="605" y="1033" text-anchor="middle" class="cn">Connaissance &amp; RAG</text>
  <text x="605" y="1053" text-anchor="middle" class="sm">(Service Interne)</text>

  <rect x="770" y="990" width="270" height="95" rx="4" class="comp"/>
  <use xlink:href="#cicon" href="#cicon" x="1006" y="997"/>
  <text x="905" y="1043" text-anchor="middle" class="cn">Moteur Politique &amp; Décision</text>

  <rect x="1070" y="990" width="270" height="95" rx="4" class="comp"/>
  <use xlink:href="#cicon" href="#cicon" x="1306" y="997"/>
  <text x="1205" y="1043" text-anchor="middle" class="cn">Exécution &amp; Audit</text>

  <!-- ================= COUCHE DONNÉES & PERSISTANCE ================= -->
  <rect x="100" y="1210" width="1300" height="200" rx="5" class="node"/>
  <text x="750" y="1234" text-anchor="middle" class="nt">Couche Données &amp; Persistance</text>
  <text x="750" y="1252" text-anchor="middle" class="st">&lt;&lt;réseau de stockage isolé&gt;&gt;</text>

  <path d="M 130 1283 L 130 1381 A 105 11 0 0 0 340 1381 L 340 1283 Z" class="db"/>
  <ellipse cx="235" cy="1283" rx="105" ry="11" class="db"/>
  <text x="235" y="1320" text-anchor="middle" class="cn">Stockage Relationnel</text>
  <text x="235" y="1339" text-anchor="middle" class="cs">&lt;&lt;PostgreSQL&gt;&gt;</text>
  <text x="235" y="1357" text-anchor="middle" class="sm">[Source de Vérité]</text>

  <path d="M 370 1283 L 370 1381 A 105 11 0 0 0 580 1381 L 580 1283 Z" class="db"/>
  <ellipse cx="475" cy="1283" rx="105" ry="11" class="db"/>
  <text x="475" y="1320" text-anchor="middle" class="cn">Index Vectoriel</text>
  <text x="475" y="1339" text-anchor="middle" class="cs">&lt;&lt;Qdrant&gt;&gt;</text>
  <text x="475" y="1357" text-anchor="middle" class="sm">[Sémantique/Lexical]</text>

  <path d="M 610 1283 L 610 1381 A 105 11 0 0 0 820 1381 L 820 1283 Z" class="db"/>
  <ellipse cx="715" cy="1283" rx="105" ry="11" class="db"/>
  <text x="715" y="1320" text-anchor="middle" class="cn">Stockage Objet</text>
  <text x="715" y="1339" text-anchor="middle" class="cs">&lt;&lt;MinIO&gt;&gt;</text>
  <text x="715" y="1357" text-anchor="middle" class="sm">[Corpus Documentaire]</text>

  <path d="M 850 1283 L 850 1381 A 105 11 0 0 0 1060 1381 L 1060 1283 Z" class="db"/>
  <ellipse cx="955" cy="1283" rx="105" ry="11" class="db"/>
  <text x="955" y="1320" text-anchor="middle" class="cn">Cache en Mémoire</text>
  <text x="955" y="1339" text-anchor="middle" class="cs">&lt;&lt;Redis&gt;&gt;</text>
  <text x="955" y="1357" text-anchor="middle" class="sm">[État Éphémère]</text>

  <path d="M 1114 1272 L 1344 1272 Q 1360 1272 1360 1288 L 1360 1376 Q 1360 1392 1344 1392 L 1114 1392 Q 1126 1362 1114 1332 Q 1102 1302 1114 1272 Z" class="q"/>
  <path d="M 1114 1272 Q 1130 1332 1114 1392" fill="none" stroke="#D35400" stroke-width="1.2" opacity="0.65"/>
  <text x="1237" y="1326" text-anchor="middle" class="cn">Bus d'Événements</text>
  <text x="1237" y="1347" text-anchor="middle" class="cs">&lt;&lt;Découplage Asynchrone&gt;&gt;</text>

  <!-- ================= SYSTÈMES D'ENTREPRISE EXTERNES ================= -->
  <rect x="100" y="1470" width="1300" height="180" rx="5" class="node"/>
  <text x="750" y="1494" text-anchor="middle" class="nt">Systèmes d'Entreprise Externes</text>
  <text x="750" y="1512" text-anchor="middle" class="st">&lt;&lt;externe&gt;&gt;</text>

  <rect x="150" y="1530" width="340" height="90" rx="4" class="comp"/>
  <use xlink:href="#cicon" href="#cicon" x="456" y="1537"/>
  <text x="320" y="1568" text-anchor="middle" class="cn">Système d'Opérations Télécom</text>
  <text x="320" y="1589" text-anchor="middle" class="sm">(Facturation, Approvisionnement)</text>

  <rect x="570" y="1530" width="340" height="90" rx="4" class="comp"/>
  <use xlink:href="#cicon" href="#cicon" x="876" y="1537"/>
  <text x="740" y="1568" text-anchor="middle" class="cn">Plateforme de Gestion de Tickets</text>
  <text x="740" y="1589" text-anchor="middle" class="sm">(GLPI)</text>

  <rect x="990" y="1530" width="340" height="90" rx="4" class="comp"/>
  <use xlink:href="#cicon" href="#cicon" x="1296" y="1537"/>
  <text x="1160" y="1568" text-anchor="middle" class="cn">Fournisseurs d'IA &amp; LLM</text>
  <text x="1160" y="1589" text-anchor="middle" class="sm">(Llama, Deepgram, etc.)</text>

  <!-- ================= CONNEXIONS (ortho) ================= -->
  <g marker-end="url(#arrow)">
    <!-- Appareils → Couche Cliente -->
    <path class="link" d="M 320 170 L 320 225 L 450 225 L 450 280"/>
    <path class="link" d="M 1180 170 L 1180 225 L 1000 225 L 1000 280"/>
    
    <!-- Couche Cliente → Couche Périphérique -->
    <path class="link" d="M 450 350 L 450 425 L 370 425 L 370 495"/>
    <path class="link" marker-start="url(#arrow)" d="M 700 330 L 750 330 L 750 495"/>
    <path class="link" d="M 1000 350 L 1000 410 L 350 410 L 350 495"/>
    
    <!-- Couche Périphérique → Cluster d'Application -->
    <path class="link" d="M 370 575 L 370 660"/>
    <path class="link" d="M 750 575 L 750 620 L 287 620 L 287 772"/>
    <path class="link" d="M 970 535 L 910 535"/>
    
    <!-- Agents → Assembleur -->
    <path class="link" d="M 410 814 L 435 814"/>
    
    <!-- Assembleur → Services Domaine Métier -->
    <path class="link" d="M 540 857 L 540 919 L 305 919 L 305 990"/>
    <path class="link" d="M 550 857 L 550 924 L 605 924 L 605 990"/>
    <path class="link" d="M 560 857 L 560 912 L 905 912 L 905 990"/>
    <path class="link" d="M 570 857 L 570 907 L 1205 907 L 1205 990"/>
    
    <!-- Politique → Exécution -->
    <path class="link" d="M 1040 1037 L 1070 1037"/>
    
    <!-- Exécution → Bus d'Événements -->
    <path class="link" d="M 1205 1085 L 1205 1180 L 1225 1180 L 1225 1272"/>
    
    <!-- Bus → Stockage Relationnel -->
    <path class="link" d="M 1160 1392 L 1160 1404 L 235 1404 L 235 1393"/>
    
    <!-- Contexte → Cache & RDBMS -->
    <path class="link" d="M 295 1085 L 295 1168 L 955 1168 L 955 1272"/>
    <path class="link" d="M 315 1085 L 315 1178 L 235 1178 L 235 1272"/>
    
    <!-- RAG → VDB & ObjStore -->
    <path class="link" d="M 595 1085 L 595 1160 L 475 1160 L 475 1272"/>
    <path class="link" d="M 615 1085 L 615 1140 L 715 1140 L 715 1272"/>
    
    <!-- Passerelle Documentaire → RAG (interne MCP) -->
    <path class="link" d="M 850 870 L 850 920 L 620 920 L 620 990"/>
    
    <!-- Passerelle Gestion Tickets → Plateforme Tickets (externe) -->
    <path class="link" d="M 1052 870 L 1052 920 L 1052 1445 L 740 1445 L 740 1530"/>
    
    <!-- Agents → Fournisseurs IA -->
    <path class="link" d="M 165 800 L 120 800 L 120 1452 L 1160 1452 L 1160 1530"/>
    
    <!-- Exécution → Système Télécom -->
    <path class="link" d="M 1205 1085 L 1205 1175 L 110 1175 L 110 1445 L 320 1445 L 320 1530"/>
  </g>

  <!-- Libellés des liens -->
  <text x="400" y="417" text-anchor="middle" class="lbl">&lt;&lt;HTTPS / REST&gt;&gt;</text>
  <text x="725" y="320" text-anchor="middle" class="lbl">&lt;&lt;WebRTC / UDP&gt;&gt;</text>
  <text x="675" y="402" text-anchor="middle" class="lbl">&lt;&lt;HTTPS / REST&gt;&gt;</text>
  <text x="380" y="620" text-anchor="start" class="lbl">&lt;&lt;Routage Interne&gt;&gt;</text>
  <text x="515" y="610" text-anchor="middle" class="lbl">&lt;&lt;gRPC / Interne&gt;&gt;</text>
  <text x="940" y="524" text-anchor="middle" class="lbl">&lt;&lt;Trunking SIP&gt;&gt;</text>
  <text x="1213" y="1130" text-anchor="start" class="lbl">&lt;&lt;Écriture Async&gt;&gt;</text>
  <text x="735" y="912" text-anchor="middle" class="lbl">&lt;&lt;MCP / RAG&gt;&gt;</text>
  <text x="1062" y="895" text-anchor="start" class="lbl">&lt;&lt;API REST&gt;&gt;</text>
  <text x="620" y="1444" text-anchor="middle" class="lbl">&lt;&lt;HTTPS / API&gt;&gt;</text>
  <text x="660" y="1167" text-anchor="middle" class="lbl">&lt;&lt;API REST&gt;&gt;</text>

</svg>
