<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="40 40 1320 900" width="1320" height="900">
<style><![CDATA[
text{font-family:Arial,Helvetica,sans-serif}
.sn{font-size:12.5px;font-weight:750;fill:#111111;text-anchor:middle}
.sdc{font-size:11.5px;fill:#222222;text-anchor:middle}
.gu{font-size:11px;fill:#333333;text-anchor:middle;paint-order:stroke;stroke:#FFFFFF;stroke-width:3.4;stroke-linejoin:round}
.gs{font-size:11px;fill:#333333;paint-order:stroke;stroke:#FFFFFF;stroke-width:3.4;stroke-linejoin:round}
.st{stroke:#333333;stroke-width:1.5}
.sh{fill:#D0D0D0;opacity:0.55}
.sep{stroke:#333333;stroke-width:1.3}
.tr{fill:none;stroke:#333333;stroke-width:1.5}
.bd{fill:#FAFAFA}
.cl{font-size:12.5px;font-style:italic;font-weight:700;fill:#555555}
.zl{font-size:11px;font-style:italic;font-weight:700;fill:#555555;text-anchor:middle}
.zg{fill:none;stroke:#333333;stroke-width:1.2;stroke-dasharray:7,5}
.ntb{fill:#F7F7F7;stroke:#333333;stroke-width:1.2;stroke-dasharray:7,5}
.nt{font-size:11.5px;font-weight:750;fill:#111111;text-anchor:middle}
.ntx{font-size:10px;fill:#333333;text-anchor:middle}
]]></style>
<defs>
<marker id="ta" viewBox="0 0 10 10" refX="9.6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
</marker>
</defs>
<rect x="40" y="40" width="1320" height="900" fill="#FFFFFF"/>

<!-- ===================== BANDES DE COLONNES ===================== -->
<rect class="bd" x="90" y="100" width="320" height="660"/>
<rect class="bd" x="530" y="100" width="340" height="660"/>
<rect class="bd" x="990" y="100" width="320" height="660"/>

<text class="cl" x="106" y="126">Accueil</text>
<text class="cl" x="546" y="126">Domaines métier</text>
<text class="cl" x="1006" y="126">Supervision et escalade</text>

<!-- ===================== ZONE GARDE-FOU ===================== -->
<rect class="zg" x="880" y="150" width="130" height="550"/>
<text class="zl" x="945" y="141">garde-fou des transferts</text>

<!-- ===================== TRANSITIONS ===================== -->

<!-- accueil -> facturation -->
<polyline class="tr" points="380,450 445,450 445,190 570,190" marker-end="url(#ta)"/>
<text class="gu" x="508" y="182">facturation</text>

<!-- accueil -> abonnement -->
<polyline class="tr" points="380,470 475,470 475,430 570,430" marker-end="url(#ta)"/>
<text class="gu" x="522" y="422">abonnement</text>

<!-- accueil -> technique -->
<polyline class="tr" points="380,490 505,490 505,670 570,670" marker-end="url(#ta)"/>
<text class="gu" x="538" y="662">technique</text>

<!-- accueil -> supervision : demande manifestement hors perimetre -->
<polyline class="tr" points="250,430 250,90 1260,90 1260,390" marker-end="url(#ta)"/>
<text class="gu" x="700" y="82">demande manifestement hors périmètre</text>

<!-- facturation -> supervision -->
<polyline class="tr" points="830,190 950,190 950,320 1120,320 1120,390" marker-end="url(#ta)"/>
<text class="gu" x="1035" y="312">hors domaine</text>

<!-- abonnement -> supervision -->
<polyline class="tr" points="830,430 1020,430" marker-end="url(#ta)"/>
<text class="gu" x="925" y="422">escalade</text>

<!-- technique -> supervision -->
<polyline class="tr" points="830,670 950,670 950,520 1180,520 1180,470" marker-end="url(#ta)"/>
<text class="gu" x="1035" y="512">escalade</text>

<!-- ===================== AGENTS ===================== -->

<!-- Agent d'accueil -->
<rect class="sh" x="123" y="433" width="260" height="80" rx="8"/>
<rect class="st" x="120" y="430" width="260" height="80" rx="8" fill="#96D5F2"/>
<line class="sep" x1="120" y1="454" x2="380" y2="454"/>
<text class="sn" x="250" y="447">Agent d'accueil</text>
<text class="sdc" x="250" y="478">ouvre la conversation</text>
<text class="sdc" x="250" y="494">qualifie la demande</text>

<!-- Agent de facturation -->
<rect class="sh" x="573" y="153" width="260" height="80" rx="8"/>
<rect class="st" x="570" y="150" width="260" height="80" rx="8" fill="#96D5F2"/>
<line class="sep" x1="570" y1="174" x2="830" y2="174"/>
<text class="sn" x="700" y="167">Agent de facturation</text>
<text class="sdc" x="700" y="198">solde, facture, règlement,</text>
<text class="sdc" x="700" y="214">report d'échéance</text>

<!-- Agent d'abonnement -->
<rect class="sh" x="573" y="393" width="260" height="80" rx="8"/>
<rect class="st" x="570" y="390" width="260" height="80" rx="8" fill="#96D5F2"/>
<line class="sep" x1="570" y1="414" x2="830" y2="414"/>
<text class="sn" x="700" y="407">Agent d'abonnement</text>
<text class="sdc" x="700" y="438">forfait, recharge,</text>
<text class="sdc" x="700" y="454">itinérance, ligne téléphonique</text>

<!-- Agent technique -->
<rect class="sh" x="573" y="633" width="260" height="80" rx="8"/>
<rect class="st" x="570" y="630" width="260" height="80" rx="8" fill="#96D5F2"/>
<line class="sep" x1="570" y1="654" x2="830" y2="654"/>
<text class="sn" x="700" y="647">Agent technique</text>
<text class="sdc" x="700" y="678">carte SIM, réseau,</text>
<text class="sdc" x="700" y="694">connectivité</text>

<!-- Agent de supervision -->
<rect class="sh" x="1023" y="393" width="260" height="80" rx="8"/>
<rect class="st" x="1020" y="390" width="260" height="80" rx="8" fill="#FCE9A8"/>
<line class="sep" x1="1020" y1="414" x2="1280" y2="414"/>
<text class="sn" x="1150" y="407">Agent de supervision</text>
<text class="sdc" x="1150" y="438">hors domaine,</text>
<text class="sdc" x="1150" y="454">pilotage des escalades</text>

<!-- ===================== LIEN DE LA ZONE ===================== -->
<polyline class="zg" points="700,780 700,730 945,730 945,700"/>

<!-- ===================== NOTES ===================== -->
<rect class="ntb" x="110" y="780" width="360" height="100" rx="10"/>
<text class="nt" x="290" y="806">Contexte transporté</text>
<text class="ntx" x="290" y="830">Le contexte déjà constitué accompagne le transfert : le client</text>
<text class="ntx" x="290" y="846">ne se réidentifie pas et ne reformule pas sa demande.</text>

<rect class="ntb" x="520" y="780" width="360" height="100" rx="10"/>
<text class="nt" x="700" y="806">Garde-fou anti-boucle</text>
<text class="ntx" x="700" y="830">Le nombre de transferts et le rang du dernier sont suivis.</text>
<text class="ntx" x="700" y="846">Au-delà, la demande est traitée comme débordant</text>
<text class="ntx" x="700" y="862">des domaines couverts.</text>

<rect class="ntb" x="930" y="780" width="360" height="100" rx="10"/>
<text class="nt" x="1110" y="806">Phrase de transition déterministe</text>
<text class="ntx" x="1110" y="830">Une phrase fixée par langue est énoncée au client.</text>
<text class="ntx" x="1110" y="846">Elle n'est pas produite par le modèle.</text>

</svg>
