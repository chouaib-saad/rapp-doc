<!-- ============ PHASE 1 : CAPTURE ET DÉTECTION DE FIN DE TOUR ============ -->
<path d="M100 160 L264 160" class="msg" marker-end="url(#mM)"/>
<text x="182" y="152" class="mlab">Flux audio temps réel</text>

<path d="M276 196 L444 196" class="msg" marker-end="url(#mM)"/>
<text x="360" y="188" class="mlab">Trames audio de parole</text>

<path d="M456 232 L684 232" class="msg" marker-end="url(#mM)"/>
<text x="570" y="224" class="mlab">Transcription partielle (streaming)</text>

<path d="M100 274 L264 274" class="msg" marker-end="url(#mM)"/>
<text x="182" y="266" class="mlab">Silence prolongé (250 ms)</text>

<path d="M276 308 L684 308" class="msg" marker-end="url(#mM)"/>
<text x="565" y="300" class="mlab">Signal de fin de tour</text>

<path d="M456 344 L684 344" class="msg" marker-end="url(#mM)"/>
<text x="570" y="336" class="mlab">Transcription définitive du tour</text>

<!-- ============ PHASE 2 : CHARGEMENT DU CONTEXTE ============ -->
<path d="M696 386 L1654 386" class="msg" marker-end="url(#mM)"/>
<rect x="1062" y="367" width="226" height="14" class="bg"/>
<text x="1175" y="378" class="mlab">Charger le contexte conversationnel</text>

<path d="M1654 420 L696 420" class="msgR" marker-end="url(#mGo)"/>
<rect x="1075" y="401" width="200" height="14" class="bg"/>
<text x="1175" y="412" class="mlab">Historique des tours précédents</text>

<!-- ============ PHASE 3 : RÉSOLUTION DE L'INTENTION (loop) ============ -->
<rect x="60" y="452" width="1460" height="266" class="frag"/>
<path d="M60,452 L135,452 L150,467 L60,467 Z" class="ftab"/>
<text x="70" y="464" class="fword">loop</text>
<rect x="176" y="454" width="266" height="15" class="bg"/>
<text x="180" y="465" class="fcond">[ intention non résolue — 2 tentatives maximum ]</text>

<path d="M696 494 L944 494" class="msg" marker-end="url(#mM)"/>
<text x="820" y="486" class="mlab">Classifier l'intention de l'énoncé</text>

<path d="M944 528 L696 528" class="msgR" marker-end="url(#mGo)"/>
<text x="820" y="520" class="mlab">Intention et score de confiance</text>

<rect x="80" y="552" width="1420" height="154" class="frag"/>
<path d="M80,552 L135,552 L150,567 L80,567 Z" class="ftab"/>
<text x="90" y="564" class="fword">opt</text>
<rect x="156" y="562" width="240" height="15" class="bg"/>
<text x="160" y="573" class="fcond">[ score de confiance inférieur au seuil ]</text>

<path d="M696 594 L1444 594" class="msg" marker-end="url(#mM)"/>
<text x="1070" y="586" class="mlab">Synthétiser la demande de précision</text>

<path d="M1444 628 L100 628" class="msg" marker-end="url(#mM)"/>
<text x="800" y="620" class="mlab">Diffuser la demande de précision</text>

<path d="M100 662 L444 662" class="msg" marker-end="url(#mM)"/>
<text x="350" y="654" class="mlab">Reformuler la demande</text>

<path d="M456 692 L684 692" class="msg" marker-end="url(#mM)"/>
<text x="570" y="684" class="mlab">Transcription de la précision</text>

<!-- ============ PHASE 4 : ROUTAGE DE LA DEMANDE (alt) ============ -->
<rect x="630" y="748" width="660" height="342" class="frag"/>
<path d="M630,748 L690,748 L705,763 L630,763 Z" class="ftab"/>
<text x="640" y="760" class="fword">alt</text>
<text x="715" y="761" class="fcond">[ intention documentaire ]</text>
<line x1="630" y1="930" x2="1290" y2="930" class="sep"/>
<text x="706" y="948" class="fcond">[ intention opérationnelle ]</text>

<path d="M696 798 L1204 798" class="msg" marker-end="url(#mM)"/>
<rect x="840" y="779" width="220" height="14" class="bg"/>
<text x="950" y="790" class="mlab">Rechercher les passages pertinents</text>

<path d="M1204 832 L696 832" class="msgR" marker-end="url(#mGo)"/>
<rect x="843" y="813" width="214" height="14" class="bg"/>
<text x="950" y="824" class="mlab">Extraits documentaires et sources</text>

<path d="M696 868 L944 868" class="msg" marker-end="url(#mM)"/>
<text x="820" y="860" class="mlab">Générer la réponse ancrée</text>

<path d="M944 902 L696 902" class="msgR" marker-end="url(#mGo)"/>
