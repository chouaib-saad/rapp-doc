<path d="M696,975 L780,975 L780,1000 L696,1000" class="msg" marker-end="url(#mM)"/>
<text x="705" y="967" class="mlabL">Exécuter l'action métier demandée</text>

<path d="M696 1032 L944 1032" class="msg" marker-end="url(#mM)"/>
<text x="820" y="1024" class="mlab">Formuler la confirmation de l'action</text>

<path d="M944 1066 L696 1066" class="msgR" marker-end="url(#mGo)"/>
<text x="820" y="1058" class="mlab">Message de confirmation</text>

<!-- ============ PHASE 5 : DIFFUSION ET JOURNALISATION (par) ============ -->
<rect x="60" y="1120" width="1660" height="580" class="frag"/>
<path d="M60,1120 L120,1120 L135,1135 L60,1135 Z" class="ftab"/>
<text x="70" y="1132" class="fword">par</text>
<rect x="141" y="1122" width="176" height="15" class="bg"/>
<text x="145" y="1133" class="fcond">[ diffusion vocale du tour ]</text>
<line x1="60" y1="1552" x2="1720" y2="1552" class="sep"/>
<rect x="66" y="1559" width="182" height="15" class="bg"/>
<text x="70" y="1570" class="fcond">[ journalisation asynchrone ]</text>

<rect x="80" y="1152" width="1440" height="376" class="frag"/>
<path d="M80,1152 L155,1152 L170,1167 L80,1167 Z" class="ftab"/>
<text x="90" y="1164" class="fword">loop</text>
<rect x="176" y="1154" width="228" height="15" class="bg"/>
<text x="180" y="1165" class="fcond">[ pour chaque segment de la réponse ]</text>

<path d="M696 1196 L1444 1196" class="msg" marker-end="url(#mM)"/>
<text x="1070" y="1188" class="mlab">Synthétiser le segment suivant</text>

<path d="M1444 1236 L100 1236" class="msg" marker-end="url(#mM)"/>
<text x="800" y="1228" class="mlab">Diffuser le fragment audio</text>

<!-- FRAGMENT break : reprise de parole (barge-in) -->
<rect x="100" y="1268" width="1400" height="248" class="frag"/>
<path d="M100,1268 L170,1268 L185,1283 L100,1283 Z" class="ftab"/>
<text x="110" y="1280" class="fword">break</text>
<rect x="191" y="1270" width="358" height="15" class="bg"/>
<text x="195" y="1281" class="fcond">[ Le client reprend la parole pendant la diffusion ]</text>

<path d="M100 1310 L264 1310" class="msg" marker-end="url(#mM)"/>
<text x="182" y="1302" class="mlab">Reprise de parole</text>

<path d="M276 1350 L684 1350" class="msg" marker-end="url(#mM)"/>
<text x="480" y="1342" class="mlab">Signal d'interruption</text>

<path d="M696 1390 L1444 1390" class="msg" marker-end="url(#mM)"/>
<rect x="940" y="1371" width="260" height="14" class="bg"/>
<text x="1070" y="1382" class="mlab">Interrompre la diffusion en cours</text>

<path d="M1444 1430 L696 1430" class="msgR" marker-end="url(#mGo)"/>
<rect x="918" y="1411" width="304" height="14" class="bg"/>
<text x="1070" y="1422" class="mlab">Diffusion arrêtée (point de coupure)</text>

<text x="705" y="1458" class="mlabL">Aligner le contexte sur</text>
<text x="705" y="1472" class="mlabL">le contenu réellement diffusé</text>
<path d="M696,1480 L780,1480 L780,1504 L696,1504" class="msg" marker-end="url(#mM)"/>

<!-- journalisation asynchrone -->
<path d="M696,1598 L780,1598 L780,1622 L696,1622" class="msg" marker-end="url(#mM)"/>
<text x="705" y="1590" class="mlabL">Évaluer le sentiment du tour</text>

<path d="M696 1654 L1654 1654" class="msg" marker-end="url(#mM)"/>
<rect x="1027" y="1635" width="296" height="14" class="bg"/>
<text x="1175" y="1646" class="mlab">Consigner le tour et le sentiment (asynchrone)</text>

<path d="M1654 1684 L696 1684" class="msgR" marker-end="url(#mGo)"/>
<rect x="1081" y="1665" width="188" height="14" class="bg"/>
<text x="1175" y="1676" class="mlab">Confirmation d'enregistrement</text>

<!-- ============ PHASE 6 : CLÔTURE DE LA SESSION (opt) ============ -->
<rect x="60" y="1730" width="1460" height="150" class="frag"/>
<path d="M60,1730 L115,1730 L130,1745 L60,1745 Z" class="ftab"/>
<text x="70" y="1742" class="fword">opt</text>
<rect x="136" y="1732" width="204" height="15" class="bg"/>
<text x="140" y="1743" class="fcond">[ intention de clôture confirmée ]</text>

<path d="M696 1772 L1444 1772" class="msg" marker-end="url(#mM)"/>
<text x="1070" y="1764" class="mlab">Synthétiser la formule de clôture</text>

<path d="M1444 1806 L100 1806" class="msg" marker-end="url(#mM)"/>
<text x="800" y="1798" class="mlab">Diffuser la formule de clôture</text>

<path d="M696,1838 L780,1838 L780,1862 L696,1862" class="msg" marker-end="url(#mM)"/>
<text x="705" y="1830" class="mlabL">Clôturer la session Contextuelle</text>

