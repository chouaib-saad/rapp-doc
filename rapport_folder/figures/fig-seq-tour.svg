
<svg xmlns="http://www.w3.org/2000/svg" width="1780" height="2040" viewBox="0 0 1780 2040">
<rect width="1780" height="2040" fill="#FFFFFF"/>
<defs>
<style>
text{font-family:Arial,Helvetica,sans-serif;}
.plab{font-size:12px;font-weight:bold;fill:#333333;text-anchor:middle;}
.pst{font-size:10px;font-style:italic;fill:#555555;text-anchor:middle;}
.bname{font-size:12px;font-weight:bold;fill:#222222;text-anchor:middle;dominant-baseline:middle;}
.mlab{font-size:12px;fill:#222222;text-anchor:middle;}
.mlabL{font-size:12px;fill:#222222;}
.fword{font-size:12px;font-weight:bold;fill:#111111;}
.fcond{font-size:11px;font-style:italic;fill:#111111;}
.bg{fill:#FFFFFF;}
.life{fill:none;stroke:#D02A50;stroke-width:1;stroke-dasharray:5,4;}
.act{fill:none;stroke:#D02A50;stroke-width:1.7;}
.pB{fill:#96D5F2;stroke:#D02A50;stroke-width:1.3;}
.pG{fill:#CDF2CD;stroke:#D02A50;stroke-width:1.3;}
.pL{fill:#E8D5F5;stroke:#D02A50;stroke-width:1.3;}
.dbbody{fill:#FFB340;stroke:#C77800;stroke-width:1.3;}
.dbtop{fill:#FFC466;stroke:#C77800;stroke-width:1.3;}
.actbar{fill:#d8d8d8;stroke:#333333;stroke-width:1;}
.msg{fill:none;stroke:#D02A50;stroke-width:1.4;}
.msgR{fill:none;stroke:#2EA843;stroke-width:1.4;stroke-dasharray:7,5;}
.frag{fill:none;stroke:#D02A50;stroke-width:1.3;}
.ftab{fill:#f1a7c1;stroke:#D02A50;stroke-width:1.1;}
.sep{stroke:#D02A50;stroke-width:1.1;stroke-dasharray:6,5;}
</style>
<filter id="ds" x="-30%" y="-30%" width="160%" height="160%">
<feDropShadow dx="3" dy="3" stdDeviation="2" flood-color="#8A8A8A" flood-opacity="0.45"/>
</filter>
<marker id="mM" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#D02A50"/></marker>
<marker id="mGo" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#2EA843" stroke-width="1.6"/></marker>
</defs>

<!-- ===================== LIFELINES ===================== -->
<path d="M100 132 L100 1910" class="life"/>
<path d="M270 132 L270 1910" class="life"/>
<path d="M450 132 L450 1910" class="life"/>
<path d="M690 132 L690 1910" class="life"/>
<path d="M950 132 L950 1910" class="life"/>
<path d="M1210 132 L1210 1910" class="life"/>
<path d="M1450 132 L1450 1910" class="life"/>
<path d="M1660 132 L1660 1910" class="life"/>

<!-- ===================== TOP PARTICIPANTS ===================== -->
<g class="act" filter="url(#ds)">
<circle cx="100" cy="45" r="8" fill="#FFF6C7"/>
<path d="M100 53 L100 78"/><path d="M86 60 L114 60"/><path d="M100 78 L87 96"/><path d="M100 78 L113 96"/>
</g>
<text x="100" y="112" class="plab">Client</text>
<text x="100" y="126" class="pst">&lt;&lt;Actor&gt;&gt;</text>

<rect x="190" y="48" width="160" height="34" class="pB" filter="url(#ds)"/>
<text x="270" y="65" class="bname">Détection d'activité</text>
<text x="270" y="106" class="pst">&lt;&lt;VAD&gt;&gt;</text>

<rect x="370" y="48" width="160" height="34" class="pB" filter="url(#ds)"/>
<text x="450" y="65" class="bname">Transcription</text>
<text x="450" y="106" class="pst">&lt;&lt;STT&gt;&gt;</text>

<rect x="610" y="48" width="160" height="34" class="pG" filter="url(#ds)"/>
<text x="690" y="65" class="bname">Agent Spécialisé</text>
<text x="690" y="106" class="pst">&lt;&lt;Orchestrateur&gt;&gt;</text>

<rect x="870" y="48" width="160" height="34" class="pL" filter="url(#ds)"/>
<text x="950" y="65" class="bname">Moteur d'Inférence</text>
<text x="950" y="106" class="pst">&lt;&lt;LLM&gt;&gt;</text>

<rect x="1115" y="48" width="190" height="34" class="pB" filter="url(#ds)"/>
<text x="1210" y="65" class="bname">Capacité documentaire</text>
<text x="1210" y="106" class="pst">&lt;&lt;Knowledge Service&gt;&gt;</text>

<rect x="1370" y="48" width="160" height="34" class="pB" filter="url(#ds)"/>
<text x="1450" y="65" class="bname">Synthèse vocale</text>
<text x="1450" y="106" class="pst">&lt;&lt;TTS&gt;&gt;</text>

