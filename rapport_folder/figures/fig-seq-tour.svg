<rect x="264" y="152" width="12" height="160" class="actbar"/>
<rect x="264" y="1306" width="12" height="52" class="actbar"/>
<rect x="444" y="190" width="12" height="158" class="actbar"/>
<rect x="444" y="655" width="12" height="43" class="actbar"/>
