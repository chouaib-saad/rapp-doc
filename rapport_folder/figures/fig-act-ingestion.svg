<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="30 35 1060 1035" width="1060" height="1035">
  <style><![CDATA[
    .nn{font-size:12.5px;font-weight:600;fill:#111111;text-anchor:middle;font-family:Arial,Helvetica,sans-serif}
    .nb{font-size:12.5px;font-weight:700;fill:#111111;text-anchor:middle;font-family:Arial,Helvetica,sans-serif}
    .ed{font-size:11.5px;font-weight:600;fill:#333333;text-anchor:middle;paint-order:stroke;stroke:#FFFDF7;stroke-width:3.4;stroke-linejoin:round;font-family:Arial,Helvetica,sans-serif}
    .es{font-size:11.5px;font-weight:600;fill:#333333;paint-order:stroke;stroke:#FFFDF7;stroke-width:3.4;stroke-linejoin:round;font-family:Arial,Helvetica,sans-serif}
    .nd{stroke:#333333;stroke-width:1.2}
    .fl{fill:none;stroke:#333333;stroke-width:1.3}
    .ln{fill:none;stroke:#333333;stroke-width:1.2;stroke-dasharray:7,5}
    .lt{font-size:13px;font-weight:700;fill:#111111;text-anchor:middle;font-family:Arial,Helvetica,sans-serif}
    .lgt{font-size:11.5px;font-weight:600;fill:#222222;font-family:Arial,Helvetica,sans-serif}
    .sl{font-size:13px;font-weight:700;fill:#222222;text-anchor:middle;font-family:Arial,Helvetica,sans-serif}
  ]]></style>
  <defs>
    <marker id="fa" viewBox="0 0 10 10" refX="9.6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
  </defs>
  <rect x="30" y="35" width="1060" height="1035" fill="#FFFFFF"/>
  
  <!-- Titres des swimlanes -->
  <text class="sl" x="290" y="60">Chaîne d'ingestion</text>
  <text class="sl" x="860" y="65">Synchronisation vers l'index</text>
  
  <!-- ============= SWIMLANE 1 : CHAÎNE D'INGESTION ============= -->
  
  <!-- Début -->
  <circle cx="290" cy="105" r="11" fill="#333333"/>
  
  <!-- Extraire et normaliser -->
  <polyline class="fl" points="290,116 290,150" marker-end="url(#fa)"/>
  <rect class="nd" x="140" y="150" width="300" height="46" rx="12" ry="12" fill="#96D5F2"/>
  <text class="nn" x="290" y="170">Extraire et normaliser</text>
  <text class="nn" x="290" y="185">le contenu du document source</text>
  
  <!-- Construire métadonnées -->
  <polyline class="fl" points="290,196 290,226" marker-end="url(#fa)"/>
  <rect class="nd" x="125" y="226" width="330" height="46" rx="12" ry="12" fill="#96D5F2"/>
  <text class="nn" x="290" y="246">Construire les métadonnées</text>
  <text class="nn" x="290" y="261">et les informations de provenance</text>
  
  <!-- Calculer empreinte -->
  <polyline class="fl" points="290,272 290,302" marker-end="url(#fa)"/>
  <rect class="nd" x="165" y="302" width="250" height="42" rx="12" ry="12" fill="#96D5F2"/>
  <text class="nn" x="290" y="327">Calculer l'empreinte du contenu</text>
  
  <!-- Décision : Empreinte inchangée ? -->
  <polyline class="fl" points="290,344 290,380" marker-end="url(#fa)"/>
  <polygon class="nd" points="195,420 290,380 385,420 290,460" fill="#FCE9A8"/>
  <text class="nn" x="290" y="418">Empreinte</text>
  <text class="nn" x="290" y="433">inchangée ?</text>
  
  <!-- Branche OUI : Arrêt -->
  <polyline class="fl" points="385,420 440,420" marker-end="url(#fa)"/>
  <text class="es" x="395" y="412">[oui]</text>
  <rect class="nd" x="440" y="397" width="112" height="46" rx="12" ry="12" fill="#F4A6A6"/>
  <text class="nn" x="496" y="415">Aucune nouvelle</text>
  <text class="nn" x="496" y="430">version à indexer</text>
  <polyline class="fl" points="496,443 496,475" marker-end="url(#fa)"/>
  <circle class="nd" cx="496" cy="490" r="13" fill="#FFFFFF"/>
  <circle cx="496" cy="490" r="7.5" fill="#333333"/>
  
  <!-- Branche NON : Versionnement -->
  <polyline class="fl" points="290,460 290,495" marker-end="url(#fa)"/>
  <text class="es" x="302" y="480">[non]</text>
  <rect class="nd" x="130" y="495" width="320" height="46" rx="12" ry="12" fill="#96D5F2"/>
  <text class="nn" x="290" y="515">Créer une nouvelle version</text>
  <text class="nn" x="290" y="530">et désactiver la version précédente</text>
  
  <!-- Segmentation -->
  <polyline class="fl" points="290,541 290,570" marker-end="url(#fa)"/>
  <rect class="nd" x="115" y="570" width="350" height="56" rx="12" ry="12" fill="#96D5F2"/>
  <text class="nn" x="290" y="592">Segmenter le contenu en fragments</text>
  <text class="nn" x="290" y="607">de 1200 caractères (recouvrement : 150)</text>
  
  <!-- Fork -->
  <polyline class="fl" points="290,626 290,660" marker-end="url(#fa)"/>
  <rect x="60" y="660" width="470" height="8" fill="#333333" rx="2"/>
  
  <!-- Représentation dense -->
  <polyline class="fl" points="165,668 165,700" marker-end="url(#fa)"/>
  <rect class="nd" x="45" y="700" width="240" height="50" rx="12" ry="12" fill="#96D5F2"/>
  <text class="nn" x="165" y="721">Générer la représentation</text>
  <text class="nn" x="165" y="736">dense (sémantique)</text>
  
  <!-- Représentation lexicale -->
  <polyline class="fl" points="425,668 425,700" marker-end="url(#fa)"/>
  <rect class="nd" x="305" y="700" width="240" height="50" rx="12" ry="12" fill="#96D5F2"/>
  <text class="nn" x="425" y="721">Générer la représentation</text>
  <text class="nn" x="425" y="736">lexicale (termes exacts)</text>
  
  <!-- Join -->
  <polyline class="fl" points="165,750 165,785"/>
  <polyline class="fl" points="425,750 425,785"/>
  <rect x="60" y="785" width="470" height="8" fill="#333333" rx="2"/>
  
  <!-- Persister transactionnellement -->
  <polyline class="fl" points="290,793 290,825" marker-end="url(#fa)"/>
  <rect class="nd" x="100" y="825" width="380" height="64" rx="12" ry="12" fill="#96D5F2"/>
  <text class="nn" x="290" y="847">Persister le document, les fragments,</text>
  <text class="nn" x="290" y="862">la tâche d'indexation et l'événement</text>
  <text class="nn" x="290" y="877">dans une transaction atomique</text>
  
  <!-- Déposer événement -->
  <polyline class="fl" points="290,889 290,920" marker-end="url(#fa)"/>
  <rect class="nd" x="115" y="920" width="350" height="46" rx="12" ry="12" fill="#96D5F2"/>
  <text class="nn" x="290" y="940">Déposer l'événement de synchronisation</text>
  <text class="nn" x="290" y="955">dans la file durable</text>
  
  <!-- Artefact : Événement de synchronisation, centré entre les deux swimlanes -->
  <polyline class="fl" points="290,966 290,1020 485,1020" marker-end="url(#fa)"/>
  <path class="nd" d="M 485,990 L 650,990 L 665,1005 L 665,1055 L 485,1055 Z" fill="#E8F4FB"/>
  <path class="nd" d="M 650,990 L 650,1005 L 665,1005" fill="none"/>
  <text class="nn" x="575" y="1018" font-weight="700">Événement de</text>
  <text class="nn" x="575" y="1033" font-weight="700">synchronisation</text>
  
  <!-- Flèche de découplage vers la synchronisation asynchrone -->
  <polyline class="fl" points="665,1022 675,1022 675,173 700,173" marker-end="url(#fa)" stroke-dasharray="7,5"/>
  <text class="ed" x="686" y="600" transform="rotate(-90 686 600)">découplage asynchrone</text>
  
  <!-- ============= SWIMLANE 2 : SYNCHRONISATION ============= -->
  
  <!-- Prélever lot -->
  <rect class="nd" x="700" y="150" width="320" height="46" rx="12" ry="12" fill="#96D5F2"/>
  <text class="nn" x="860" y="170">Prélever un lot de synchronisation</text>
  <text class="nn" x="860" y="185">(jusqu'à 200 événements)</text>
  
  <!-- Pour chaque événement -->
  <polyline class="fl" points="860,196 860,230" marker-end="url(#fa)"/>
  <rect class="nd" x="710" y="230" width="300" height="46" rx="12" ry="12" fill="#96D5F2"/>
  <text class="nn" x="860" y="250">Pour chaque événement</text>
  <text class="nn" x="860" y="265">du lot prélevé</text>
  
  <!-- Insérer / mettre à jour -->
  <polyline class="fl" points="860,276 860,310" marker-end="url(#fa)"/>
  <rect class="nd" x="685" y="310" width="350" height="46" rx="12" ry="12" fill="#96D5F2"/>
  <text class="nn" x="860" y="330">Insérer ou mettre à jour les représentations</text>
  <text class="nn" x="860" y="345">dense et lexicale dans l'index</text>
  
  <!-- Rendre récupérable -->
  <polyline class="fl" points="860,356 860,390" marker-end="url(#fa)"/>
  <rect class="nd" x="700" y="390" width="320" height="46" rx="12" ry="12" fill="#96D5F2"/>
  <text class="nn" x="860" y="410">Rendre la nouvelle version</text>
  <text class="nn" x="860" y="425">récupérable dans l'index</text>
  
  <!-- Marquer comme traité -->
  <polyline class="fl" points="860,436 860,470" marker-end="url(#fa)"/>
  <rect class="nd" x="720" y="470" width="280" height="42" rx="12" ry="12" fill="#96D5F2"/>
  <text class="nn" x="860" y="495">Marquer l'événement comme traité</text>
  
  <!-- Décision : Événements restants ? -->
  <polyline class="fl" points="860,512 860,548" marker-end="url(#fa)"/>
  <polygon class="nd" points="770,588 860,548 950,588 860,628" fill="#FCE9A8"/>
  <text class="nn" x="860" y="586">Événements</text>
  <text class="nn" x="860" y="601">restants ?</text>
  
  <!-- Branche NON : Fin -->
  <polyline class="fl" points="860,628 860,658" marker-end="url(#fa)"/>
  <text class="es" x="872" y="648">[non]</text>
  <circle class="nd" cx="860" cy="673" r="13" fill="#FFFFFF"/>
  <circle cx="860" cy="673" r="7.5" fill="#333333"/>
  
  <!-- Branche OUI : Boucle vers Prélever -->
  <polyline class="fl" points="950,588 1070,588 1070,173 1020,173" marker-end="url(#fa)"/>
  <text class="es" x="1010" y="580" text-anchor="end">[oui]</text>
  <text class="ed" x="1062" y="368" text-anchor="middle" transform="rotate(90 1062 380)">lot suivant</text>
</svg>
