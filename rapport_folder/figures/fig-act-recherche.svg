<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="30 50 1120 930" width="1120" height="930">
<style><![CDATA[
.nn{font-size:12.5px;font-weight:600;fill:#111111;text-anchor:middle;font-family:Arial,Helvetica,sans-serif}
.ed{font-size:11.5px;font-weight:600;fill:#333333;text-anchor:middle;paint-order:stroke;stroke:#FFFFFF;stroke-width:3.4;stroke-linejoin:round;font-family:Arial,Helvetica,sans-serif}
.es{font-size:11.5px;font-weight:600;fill:#333333;paint-order:stroke;stroke:#FFFFFF;stroke-width:3.4;stroke-linejoin:round;font-family:Arial,Helvetica,sans-serif}
.nd{stroke:#333333;stroke-width:1.2}
.fl{fill:none;stroke:#333333;stroke-width:1.3}
.ln{fill:none;stroke:#333333;stroke-width:1.2;stroke-dasharray:7,5}
.sl{font-size:16px;font-weight:790;fill:#111111;text-anchor:middle;font-family:Arial,Helvetica,sans-serif}
.sb{font-size:11.5px;font-weight:500;fill:#444444;text-anchor:middle;font-family:Arial,Helvetica,sans-serif}
]]></style>

<defs>
<marker id="fa" viewBox="0 0 10 10" refX="9.6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
</marker>
</defs>

<rect x="30" y="50" width="1120" height="930" fill="#FFFFFF"/>
<!-- ===================== SWIMLANES ===================== -->
<text class="sl" x="370" y="80">Préparation et recherche</text>
<text class="sl" x="955" y="80">Construction du contexte</text>


<!-- ============ SWIMLANE 1 : PRÉPARATION ET RECHERCHE ============ -->

<!-- Début -->
<circle cx="375" cy="130" r="11" fill="#333333"/>
<polyline class="fl" points="375,141 375,162" marker-end="url(#fa)"/>

<!-- Action 1 -->
<rect class="nd" x="195" y="164" width="360" height="42" rx="12" ry="12" fill="#96D5F2"/>
<text class="nn" x="375" y="190">Recevoir la requête de recherche de l'agent</text>
<polyline class="fl" points="375,206 375,236" marker-end="url(#fa)"/>

<!-- Action 2 -->
<rect class="nd" x="205" y="238" width="340" height="46" rx="12" ry="12" fill="#96D5F2"/>
<text class="nn" x="375" y="258">Analyser la requête</text>
<text class="nn" x="375" y="274">et le contexte conversationnel</text>
<polyline class="fl" points="375,284 375,314" marker-end="url(#fa)"/>

<!-- Action 3 : point de reprise des deux boucles -->
<rect class="nd" x="205" y="316" width="340" height="42" rx="12" ry="12" fill="#96D5F2"/>
<text class="nn" x="375" y="342">Formuler une requête de recherche autonome</text>
<polyline class="fl" points="375,358 375,388" marker-end="url(#fa)"/>

<!-- Décision 1 : Requête exploitable ? -->
<polygon class="nd" points="280,429 375,392 470,429 375,466" fill="#FCE9A8"/>
<text class="nn" x="375" y="425">Requête</text>
<text class="nn" x="375" y="441">exploitable ?</text>

<!-- Branche [non] : Reformuler la requête -->
<polyline class="fl" points="470,429 561,429" marker-end="url(#fa)"/>
<text class="ed" x="512" y="421">[non]</text>
<rect class="nd" x="565" y="406" width="130" height="46" rx="12" ry="12" fill="#F4A6A6"/>
<text class="nn" x="630" y="426">Reformuler</text>
<text class="nn" x="630" y="442">la requête</text>
<polyline class="fl" points="630,406 630,337 547,337" marker-end="url(#fa)"/>

<!-- Branche [oui] -->
<polyline class="fl" points="375,466 375,498" marker-end="url(#fa)"/>
<text class="es" x="386" y="480">[oui]</text>

<!-- Action 4 -->
<rect class="nd" x="195" y="500" width="360" height="42" rx="12" ry="12" fill="#96D5F2"/>
<text class="nn" x="375" y="526">Appliquer les filtres documentaires et de version</text>
<polyline class="fl" points="375,542 375,576" marker-end="url(#fa)"/>

<!-- Fork UML -->
<rect x="150" y="578" width="450" height="8" rx="2" fill="#333333"/>
<polyline class="fl" points="250,586 250,618" marker-end="url(#fa)"/>
<polyline class="fl" points="500,586 500,618" marker-end="url(#fa)"/>

<!-- Branche dense -->
<rect class="nd" x="155" y="620" width="190" height="46" rx="12" ry="12" fill="#96D5F2"/>
<text class="nn" x="250" y="640">Rechercher par</text>
<text class="nn" x="250" y="656">similarité dense</text>

<!-- Branche lexicale -->
<rect class="nd" x="405" y="620" width="190" height="46" rx="12" ry="12" fill="#96D5F2"/>
<text class="nn" x="500" y="640">Rechercher par</text>
<text class="nn" x="500" y="656">correspondance lexicale</text>

<!-- Join UML -->
<polyline class="fl" points="250,666 250,700"/>
<polyline class="fl" points="500,666 500,700"/>
<rect x="150" y="700" width="450" height="8" rx="2" fill="#333333"/>
<polyline class="fl" points="375,708 375,738" marker-end="url(#fa)"/>

<!-- Action 5 : fusion -->
<rect class="nd" x="225" y="740" width="300" height="42" rx="12" ry="12" fill="#96D5F2"/>
<text class="nn" x="375" y="766">Fusionner les résultats hybrides (RRF)</text>
<polyline class="fl" points="375,782 375,812" marker-end="url(#fa)"/>

<!-- Action 6 : reranking -->
<rect class="nd" x="265" y="814" width="220" height="42" rx="12" ry="12" fill="#96D5F2"/>
<text class="nn" x="375" y="840">Reranker les candidats</text>
<polyline class="fl" points="375,856 375,888" marker-end="url(#fa)"/>

<!-- Décision 2 : Évidence suffisante ? -->
<polygon class="nd" points="280,927 375,890 470,927 375,964" fill="#FCE9A8"/>
<text class="nn" x="375" y="923">Évidence</text>
<text class="nn" x="375" y="939">suffisante ?</text>

<!-- Branche [non] : affiner et relancer -->
<polyline class="fl" points="280,927 220,927" marker-end="url(#fa)"/>
<text class="ed" x="250" y="918">[non]</text>
<rect class="nd" x="38" y="904" width="180" height="46" rx="12" ry="12" fill="#F4A6A6"/>
<text class="nn" x="128" y="924">Affiner la requête</text>
<text class="nn" x="128" y="940">et relancer la recherche</text>
<polyline class="fl" points="128,904 128,337 203,337" marker-end="url(#fa)"/>
<text class="ed" x="112" y="640" transform="rotate(-90 112 640)">nouvelle itération de recherche</text>

<!-- Branche [oui] : passage vers la construction du contexte -->
<polyline class="fl" points="470,927 725,927 725,464 763,464" marker-end="url(#fa)"/>
<text class="ed" x="505" y="918">[oui]</text>
<text class="ed" x="550" y="533" transform="rotate(-90 690 510)">fragments validés</text>


<!-- ============ SWIMLANE 2 : CONSTRUCTION DU CONTEXTE ============ -->

<!-- Action 7 -->
<rect class="nd" x="765" y="440" width="380" height="48" rx="12" ry="12" fill="#96D5F2"/>
<text class="nn" x="955" y="460">Sélectionner les fragments pertinents</text>
<text class="nn" x="955" y="476">pour le grounding</text>
<polyline class="fl" points="955,488 955,520" marker-end="url(#fa)"/>

<!-- Action 8 -->
<rect class="nd" x="805" y="522" width="300" height="42" rx="12" ry="12" fill="#96D5F2"/>
<text class="nn" x="955" y="548">Construire le contexte documentaire</text>
<polyline class="fl" points="955,564 955,596" marker-end="url(#fa)"/>

<!-- Action 9 -->
<rect class="nd" x="785" y="598" width="340" height="48" rx="12" ry="12" fill="#CDF2CD"/>
<text class="nn" x="955" y="618">Retourner les fragments pertinents</text>
<text class="nn" x="955" y="634">et leurs sources à l'agent</text>
<polyline class="fl" points="955,646 955,665" marker-end="url(#fa)"/>

<!-- Fin -->
<circle class="nd" cx="955" cy="678" r="13" fill="#FFFFFF"/>
<circle cx="955" cy="678" r="7.5" fill="#333333"/>

</svg>