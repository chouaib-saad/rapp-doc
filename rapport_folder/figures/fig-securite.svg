<svg xmlns="http://www.w3.org/2000/svg" viewBox="85 45 1130 1150" width="1130" height="1150">
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#111111" />
        </marker>
        <marker id="arrow-dash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" />
        </marker>
    </defs>

    <style>
        .title-main { font-family: Arial, Helvetica, sans-serif; font-size: 22px; font-weight: bold; fill: #0f172a; }
        .title-boundary { font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: bold; fill: #334155; letter-spacing: 0.5px; }
        .box-title { font-family: Arial, Helvetica, sans-serif; font-size: 12px; font-weight: bold; fill: #ffffff; text-anchor: middle; }
        .box-text { font-family: Arial, Helvetica, sans-serif; font-size: 11.5px; fill: #1e293b; text-anchor: middle; }
        .box-subtext { font-family: Arial, Helvetica, sans-serif; font-size: 10.5px; fill: #475569; text-anchor: middle; font-style: italic; }
        .decision-text { font-family: Arial, Helvetica, sans-serif; font-size: 11px; font-weight: bold; fill: #0f172a; text-anchor: middle; }
        .label-text { font-family: Arial, Helvetica, sans-serif; font-size: 11px; font-weight: bold; fill: #475569; text-anchor: middle; }
        .note-title { font-family: Arial, Helvetica, sans-serif; font-size: 11px; font-weight: bold; fill: #0f172a; }
        .note-text { font-family: Arial, Helvetica, sans-serif; font-size: 10.5px; fill: #334155; font-style: italic; }
        .flow-line { fill: none; stroke: #111111; stroke-width: 1.5; marker-end: url(#arrow); stroke-linejoin: round; }
        .flow-line-dash { fill: none; stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 4,4; marker-end: url(#arrow-dash); }
        .boundary1 { fill: #FFFFFF; fill-opacity: 0.4; stroke: #0284c7; stroke-width: 2; stroke-dasharray: 8,4; rx: 8; }
        .boundary2 { fill: #FFFFFF; fill-opacity: 0.4; stroke: #ea580c; stroke-width: 2; stroke-dasharray: 8,4; rx: 8; }
        .box-shape { fill: #ffffff; stroke: #111111; stroke-width: 1.5; }
        .box-header-dark { fill: #1e293b; }
        .box-header-gray { fill: #475569; }
        .box-header-blue { fill: #0284c7; }
        .box-header-orange { fill: #ea580c; }
        .box-header-red { fill: #b91c1c; }
        .note-box { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.2; stroke-dasharray: 4,3; rx: 4; }
    </style>

    <rect x="85" y="45" width="1130" height="1150" fill="#ffffff" />


    <!-- ==================== USER ==================== -->
    <circle cx="650" cy="75" r="12" fill="none" stroke="#111111" stroke-width="1.5"/>
    <path d="M 630 105 C 630 85, 670 85, 670 105" fill="none" stroke="#111111" stroke-width="1.5"/>
    <text x="650" y="125" class="label-text" style="font-size: 12px;">Utilisateur</text>

    <path class="flow-line" d="M 650 135 L 650 160" />

    <!-- ==================== BOUNDARY 1 ==================== -->
    <rect class="boundary1" x="200" y="150" width="900" height="440" />
    <text x="220" y="175" class="title-boundary" fill="#0284c7">FRONTIÈRE 1 - ACCÈS À LA PLATEFORME</text>

    <!-- AuthN -->
    <rect class="box-shape" x="450" y="190" width="400" height="65" />
    <rect class="box-header-dark" x="450" y="190" width="400" height="22" />
    <text x="650" y="205" class="box-title">AUTHENTIFICATION CENTRALISÉE (AuthN)</text>
    <text x="650" y="230" class="box-text">session revalidée à chaque requête</text>
    <text x="650" y="245" class="box-subtext">Session / Access Token (JWT)</text>

    <!-- Routing -->
    <path class="flow-line" d="M 550 255 L 550 280 L 400 280 L 400 300" />
    <path class="flow-line" d="M 750 255 L 750 280 L 900 280 L 900 300" />
    
    <text x="475" y="275" class="label-text">[rôle client]</text>
    <text x="825" y="275" class="label-text">[rôles internes]</text>

    <!-- Portail & Console -->
    <rect class="box-shape" x="300" y="300" width="200" height="45" />
    <rect class="box-header-gray" x="300" y="300" width="200" height="20" />
    <text x="400" y="314" class="box-title">PORTAIL CLIENT</text>
    <text x="400" y="335" class="box-text">Espace self-service</text>

    <rect class="box-shape" x="800" y="300" width="200" height="45" />
    <rect class="box-header-gray" x="800" y="300" width="200" height="20" />
    <text x="900" y="314" class="box-title">CONSOLE D'ADMINISTRATION</text>
    <text x="900" y="335" class="box-text">Outils conseillers &amp; supervisors</text>

    <!-- Converge to AuthZ -->
    <path class="flow-line" d="M 400 345 L 400 370 L 550 370 L 550 390" />
    <path class="flow-line" d="M 900 345 L 900 370 L 750 370 L 750 390" />

    <!-- AuthZ -->
    <rect class="box-shape" x="400" y="390" width="500" height="90" />
    <rect class="box-header-dark" x="400" y="390" width="500" height="22" />
    <text x="650" y="405" class="box-title">AUTORISATION SERVEUR (AuthZ)</text>
    <text x="650" y="430" class="box-text" style="font-weight: bold;">RBAC : Client · Conseiller · Superviseur · Administrateur</text>
    <text x="650" y="450" class="box-text">Server-side enforcement · Deny by default · Least privilege</text>
    <text x="650" y="468" class="box-subtext">contrôle à chaque appel</text>

    <!-- Routing to Data -->
    <path class="flow-line" d="M 550 480 L 550 510 L 420 510 L 420 530" />
    <path class="flow-line" d="M 750 480 L 750 510 L 880 510 L 880 530" />

    <!-- Data & Resources -->
    <rect class="box-shape" x="300" y="530" width="240" height="50" />
    <rect class="box-header-blue" x="300" y="530" width="240" height="20" />
    <text x="420" y="544" class="box-title">DONNÉES PROPRES AU CLIENT</text>
    <text x="420" y="568" class="box-text">Isolation stricte par identité</text>

    <rect class="box-shape" x="760" y="530" width="240" height="50" />
    <rect class="box-header-orange" x="760" y="530" width="240" height="20" />
    <text x="880" y="544" class="box-title">RESSOURCES D'ADMINISTRATION</text>
    <text x="880" y="568" class="box-text">Outils et données internes</text>

    <!-- ==================== BOUNDARY 2 ==================== -->
    <path class="flow-line" d="M 420 580 L 420 630" />
    
    <rect class="boundary2" x="100" y="610" width="1100" height="570" />
    <text x="120" y="635" class="title-boundary" fill="#ea580c">FRONTIÈRE 2 - OPÉRATIONS </text>

    <!-- Decision -->
    <polygon points="420,640 470,670 420,700 370,670" fill="#ffffff" stroke="#111111" stroke-width="1.5" />
    <text x="420" y="666" class="decision-text">Opération</text>
    <text x="420" y="678" class="decision-text">sensible ?</text>

    <!-- Branch NON -->
    <path class="flow-line" d="M 370 670 L 270 670 L 270 710" />
    <text x="320" y="662" class="label-text">[non]</text>
    
    <rect class="box-shape" x="190" y="710" width="160" height="50" />
    <rect class="box-header-gray" x="190" y="710" width="160" height="20" />
    <text x="270" y="724" class="box-title">EXÉCUTION DIRECTE</text>
    <text x="270" y="745" class="box-text">Traitement standard</text>

    <!-- Branch OUI -->
    <path class="flow-line" d="M 470 670 L 650 670 L 650 710" />
    <text x="510" y="662" class="label-text">[oui]</text>

    <!-- Step-up AuthN -->
    <rect class="box-shape" x="520" y="710" width="260" height="60" />
    <rect class="box-header-red" x="520" y="710" width="260" height="22" />
    <text x="650" y="725" class="box-title">VÉRIFICATION D'IDENTITÉ</text>
    <text x="650" y="748" class="box-text">Step-up AuthN</text>
    <text x="650" y="762" class="box-subtext">contrôle borné et contextuel</text>

    <path class="flow-line" d="M 650 770 L 650 800" />

    <!-- Policy Engine -->
    <rect class="box-shape" x="520" y="800" width="260" height="60" />
    <rect class="box-header-red" x="520" y="800" width="260" height="22" />
    <text x="650" y="815" class="box-title">POLICY / DECISION ENGINE</text>
    <text x="650" y="838" class="box-text">règles métier + contraintes</text>
    <text x="650" y="852" class="box-subtext">d'autorisation</text>

    <path class="flow-line" d="M 650 860 L 650 890" />

    <!-- Verdict -->
    <rect class="box-shape" x="520" y="890" width="260" height="50" />
    <rect class="box-header-red" x="520" y="890" width="260" height="22" />
    <text x="650" y="905" class="box-title">VERDICT DE DÉCISION</text>
    <text x="650" y="928" class="box-text">Autorisé / Refusé</text>

    <path class="flow-line" d="M 650 940 L 650 970" />

    <!-- Execution + Audit -->
    <rect class="box-shape" x="520" y="970" width="260" height="60" />
    <rect class="box-header-red" x="520" y="970" width="260" height="22" />
    <text x="650" y="985" class="box-title">EXÉCUTION + AUDIT</text>
    <text x="650" y="1008" class="box-text">action autorisée uniquement</text>
    <text x="650" y="1022" class="box-subtext">après validation · trace de sécurité</text>

    <path class="flow-line" d="M 650 1030 L 650 1060" />

    <!-- Journal -->
    <rect class="box-shape" x="520" y="1060" width="260" height="60" />
    <rect class="box-header-dark" x="520" y="1060" width="260" height="22" />
    <text x="650" y="1075" class="box-title">JOURNAL D'AUDIT CHAÎNÉ</text>
    <text x="650" y="1098" class="box-text">intégrité par empreinte</text>
    <text x="650" y="1112" class="box-subtext">du précédent</text>

</svg>
