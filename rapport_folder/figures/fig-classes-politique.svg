    .stereo { font-size: 11px; font-style: italic; fill: #444; }
    .feat { font-size: 11.5px; fill: #222; }
    .mult { font-size: 10.5px; fill: #333; paint-order: stroke; stroke: #fffdf7; stroke-width: 3.2; }
