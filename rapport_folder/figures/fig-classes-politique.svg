    .rel, .reld { fill: none; stroke: #333; stroke-width: 1.4; }
    .reld { stroke-dasharray: 7, 5; }
    .sep { stroke: #333; stroke-width: 1.2; }
    .shd { fill: #c9c9c9; opacity: .45; }
    .bx { stroke: #333; stroke-width: 1.5; }
    .green { fill: #a9efb0; }
    .yellow { fill: #fff4a6; }
    .purple { fill: #e2d4f5; }
    .grey { fill: #e3e3e3; }
  </style>

