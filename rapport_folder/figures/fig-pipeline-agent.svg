<svg xmlns="http://www.w3.org/2000/svg" version="1.1" id="fig-pipeline-agent" width="1100" height="500" viewBox="0 0 1100 500" role="img" aria-labelledby="pipeline-title">
  <title id="pipeline-title">Pipeline de raisonnement d’un agent</title>
  
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
      .layer-title { font-size: 15px; font-weight: 700; fill: #165A2E; text-anchor: middle; }
      .input-box { fill: #F8F8F8; stroke: #D0D0D0; stroke-width: 1.5; }
      .input-title { font-size: 13px; font-weight: 700; fill: #000000; text-anchor: middle; }
      .step { fill: #FFFFFF; stroke: #000000; stroke-width: 1.3; }
      .validation { fill: #1B6C45; stroke: #165A2E; stroke-width: 1.5; }
      .step-title { font-size: 15px; font-weight: 700; fill: #000000; text-anchor: middle; }
      .step-detail { font-size: 12.5px; font-style: italic; fill: #111111; text-anchor: middle; }
      .inverse { fill: #FFFFFF; }
      .outcome-title { font-size: 14px; font-weight: 700; fill: #000000; text-anchor: middle; }
      .flow { fill: none; stroke: #000000; stroke-width: 1.8; stroke-linejoin: round; }
      .branch { fill: none; stroke: #000000; stroke-width: 1.7; stroke-linejoin: round; }
      .dependency { fill: none; stroke: #333333; stroke-width: 1.5; stroke-dasharray: 5,4; }
      .guard { font-size: 12.5px; fill: #000000; text-anchor: middle; }
      .note-text { font-size: 13px; font-style: italic; fill: #111111; text-anchor: middle; }
      .note-key { font-size: 16px; font-weight: 700; fill: #165A2E; text-anchor: middle; }
    </style>
    
    <marker id="arrow-end" viewBox="0 0 8 7" refX="8" refY="3.5" markerWidth="10" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L8 3.5 L0 7 Z" fill="#000000"/>
    </marker>

    <marker id="dependency-end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L8 5 L1 9" fill="none" stroke="#333333" stroke-width="1.4"/>
    </marker>
  </defs>

  <rect width="1100" height="500" fill="#FFFFFF"/>

  <g id="couches">
    <rect x="24" y="130" width="484" height="164" fill="#E4F0E3" stroke="#389B88" stroke-width="1.2" stroke-dasharray="7,5"/>
    <rect x="548" y="130" width="240" height="164" fill="#E4F0E3" stroke="#165A2E" stroke-width="1.5"/>
    <text x="266" y="276" class="layer-title">Couche probabiliste</text>
    <text x="668" y="276" class="layer-title">Couche déterministe</text>
  </g>

  <g id="apports" class="dependency" marker-end="url(#dependency-end)">
    <path d="M140 76 V166"/>
    <path d="M392 76 V166"/>
    <path d="M668 76 V166"/>
  </g>

  <g id="flux-principal" class="flow" marker-end="url(#arrow-end)">
    <path d="M236 208 H296"/>
    <path d="M488 208 H568"/>
    <path d="M768 208 H884"/>
  </g>

  <g id="issues-alternatives" class="branch" marker-end="url(#arrow-end)">
    <path d="M768 222 H816 Q824 222 824 230 V314 Q824 322 832 322 H884"/>
    <path d="M768 236 H790 Q798 236 798 244 V428 Q798 436 806 436 H884"/>
  </g>

  <path d="M668 342 V294" fill="none" stroke="#666666" stroke-width="1" stroke-dasharray="4,4"/>

  <g id="entrees">
    <rect x="54" y="34" width="172" height="42" rx="3" class="input-box"/>
    <text x="140" y="60" class="input-title">Contexte assemblé</text>
    
    <rect x="306" y="34" width="172" height="42" rx="3" class="input-box"/>
    <text x="392" y="60" class="input-title">Capacités détenues</text>
    
    <rect x="582" y="34" width="172" height="42" rx="3" class="input-box"/>
    <text x="668" y="60" class="input-title">Règles et seuils</text>
  </g>

  <g id="interpretation">
    <rect x="44" y="166" width="192" height="84" rx="3" class="step"/>
    <text x="140" y="190" class="step-title">Interprétation</text>
    <text x="140" y="209" class="step-title">de la demande</text>
    <text x="140" y="234" class="step-detail">au regard du contexte</text>
  </g>

  <g id="intention">
    <rect x="296" y="166" width="192" height="84" rx="3" class="step"/>
    <text x="392" y="190" class="step-title">Détermination</text>
    <text x="392" y="209" class="step-title">de l’intention</text>
    <text x="392" y="234" class="step-detail">répondre, agir, transmettre</text>
  </g>

  <g id="validation">
    <rect x="568" y="166" width="200" height="84" rx="3" class="validation"/>
    <text x="668" y="190" class="step-title inverse">Validation par</text>
    <text x="668" y="209" class="step-title inverse">les contraintes</text>
    <text x="668" y="234" class="step-detail inverse">règles métier</text>
  </g>

  <g id="realisation">
    <rect x="884" y="174" width="192" height="68" rx="3" class="step"/>
    <text x="980" y="201" class="step-title">Réalisation</text>
    <text x="980" y="221" class="step-title">et restitution</text>
  </g>

  <g id="refus">
    <rect x="884" y="288" width="192" height="68" rx="3" class="step"/>
    <text x="980" y="316" class="outcome-title">Refus motivé,</text>
    <text x="980" y="336" class="outcome-title">énoncé au client</text>
  </g>

  <g id="transmission">
    <rect x="884" y="402" width="192" height="68" rx="3" class="step"/>
    <text x="980" y="430" class="outcome-title">Transmission</text>
    <text x="980" y="450" class="outcome-title">à un conseiller</text>
  </g>

  <g id="verdicts">
    <text x="826" y="197" class="guard">autorisée</text>
    <text x="854" y="311" class="guard">refusée</text>
    <text x="841" y="425" class="guard">à transmettre</text>
  </g>

  <g id="note">
    <rect x="44" y="342" width="724" height="128" rx="3" fill="#FFFFFF" stroke="#333333" stroke-width="1.3"/>
    <text x="406" y="368" class="note-text">
      <tspan x="406" y="368">Le modèle de langue intervient aux deux premières étapes, où sa</tspan>
      <tspan x="406" y="387">capacité d’interprétation est irremplaçable.</tspan>
      <tspan x="406" y="408">Il n’intervient pas à laa troisième :</tspan>
    </text>
    <text x="406" y="445" class="note-key">le modèle propose, il ne dispose pas.</text>
  </g>
</svg>
