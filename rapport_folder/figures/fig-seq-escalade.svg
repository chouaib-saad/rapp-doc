<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="1210" viewBox="0 0 1250 1210">
<rect width="1250" height="1210" fill="#FFFFFF"/>
<defs>
<style>
text{font-family:Arial,Helvetica,sans-serif;}
.plab{font-size:12px;font-weight:bold;fill:#333333;text-anchor:middle;}
.pst{font-size:10px;font-style:italic;fill:#555555;text-anchor:middle;}
.bname{font-size:12px;font-weight:bold;fill:#222222;text-anchor:middle;dominant-baseline:middle;}
.mlab{font-size:12px;fill:#222222;text-anchor:middle;}
.mlabL{font-size:12px;fill:#222222;}
.fword{font-size:12px;font-weight:bold;fill:#111111;}
.fcond{font-size:11px;font-style:italic;fill:#111111;}
.life{fill:none;stroke:#D02A50;stroke-width:1;stroke-dasharray:5,4;}
.act{fill:none;stroke:#D02A50;stroke-width:1.7;}
.pB{fill:#96D5F2;stroke:#D02A50;stroke-width:1.3;}
.pG{fill:#CDF2CD;stroke:#D02A50;stroke-width:1.3;}
.actbar{fill:#d8d8d8;stroke:#333333;stroke-width:1;}
.msg{fill:none;stroke:#D02A50;stroke-width:1.4;}
.msgR{fill:none;stroke:#2EA843;stroke-width:1.4;stroke-dasharray:7,5;}
.frag{fill:none;stroke:#D02A50;stroke-width:1.3;}
.ftab{fill:#f1a7c1;stroke:#D02A50;stroke-width:1.1;}
.sep{stroke:#D02A50;stroke-width:1.1;stroke-dasharray:6,5;}
.callout{fill:#fff4a6;stroke:#D02A50;stroke-width:1.2;}
.fold{fill:#F0E08A;stroke:#D02A50;stroke-width:1.2;}
.ct{font-size:10.5px;font-style:italic;fill:#111111;}
.ctb{font-size:11px;font-weight:bold;font-style:italic;fill:#111111;}
</style>
<filter id="ds" x="-30%" y="-30%" width="160%" height="160%">
<feDropShadow dx="3" dy="3" stdDeviation="2" flood-color="#8A8A8A" flood-opacity="0.45"/>
</filter>
<marker id="mM" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#D02A50"/></marker>
<marker id="mGo" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#2EA843" stroke-width="1.6"/></marker>
<marker id="mSelf" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#D02A50"/></marker>
</defs>

<!-- ===================== LIFELINES ===================== -->
<path d="M100 132 L100 1110" class="life"/>
<path d="M300 132 L300 1110" class="life"/>
<path d="M500 132 L500 1110" class="life"/>
<path d="M720 132 L720 1110" class="life"/>
<path d="M940 132 L940 1110" class="life"/>
<path d="M1140 132 L1140 1110" class="life"/>

<!-- ===================== TOP PARTICIPANTS ===================== -->
<g class="act" filter="url(#ds)">
<circle cx="100" cy="45" r="8" fill="#FFF6C7"/>
<path d="M100 53 L100 78"/><path d="M86 60 L114 60"/><path d="M100 78 L87 96"/><path d="M100 78 L113 96"/>
</g>
<text x="100" y="112" class="plab">Client</text>
<text x="100" y="126" class="pst">&lt;&lt;Actor&gt;&gt;</text>

<rect x="215" y="48" width="170" height="34" class="pB" filter="url(#ds)"/>
<text x="300" y="65" class="bname">Agent de Supervision</text>
<text x="300" y="106" class="pst">&lt;&lt;Orchestrateur&gt;&gt;</text>

<rect x="415" y="48" width="170" height="34" class="pG" filter="url(#ds)"/>
<text x="500" y="65" class="bname">Service de Routage</text>
<text x="500" y="106" class="pst">&lt;&lt;Availability&gt;&gt;</text>

<rect x="635" y="48" width="170" height="34" class="pB" filter="url(#ds)"/>
<text x="720" y="65" class="bname">Système de Tickets</text>
<text x="720" y="106" class="pst">&lt;&lt;External System&gt;&gt;</text>

<rect x="855" y="48" width="170" height="34" class="pG" filter="url(#ds)"/>
<text x="940" y="65" class="bname">Service de Notification</text>
<text x="940" y="106" class="pst">&lt;&lt;External System&gt;&gt;</text>

<g class="act" filter="url(#ds)">
<circle cx="1140" cy="45" r="8" fill="#FFF6C7"/>
<path d="M1140 53 L1140 78"/><path d="M1126 60 L1154 60"/><path d="M1140 78 L1127 96"/><path d="M1140 78 L1153 96"/>
</g>
<text x="1140" y="112" class="plab">Conseiller</text>
<text x="1140" y="126" class="pst">&lt;&lt;Actor&gt;&gt;</text>

<!-- ===================== ACTIVATION BARS ===================== -->
<rect x="294" y="140" width="12" height="940" class="actbar"/>
<rect x="494" y="260" width="12" height="60" class="actbar"/>
<rect x="494" y="400" width="12" height="60" class="actbar"/>
<rect x="1134" y="480" width="12" height="60" class="actbar"/>
<rect x="494" y="660" width="12" height="60" class="actbar"/>
<rect x="714" y="820" width="12" height="60" class="actbar"/>
<rect x="934" y="900" width="12" height="140" class="actbar"/>
<rect x="1134" y="985" width="12" height="55" class="actbar"/>

<!-- ===================== MESSAGES (PHASE INITIALE) ===================== -->
<path d="M100 150 L294 150" class="msg" marker-end="url(#mM)"/>
<text x="197" y="140" class="mlab">Demande d'assistance humaine</text>

<path d="M306,190 L380,190 L380,210 L306,210" fill="none" stroke="#D02A50" stroke-width="1.4" marker-end="url(#mSelf)"/>
<text x="315" y="180" class="mlabL">Constituer le dossier de l'échange</text>

<!-- Lien pointillé : Alignement orthogonal strict (horizontal) du centre de la boucle vers le centre de la note -->
<line x1="380" y1="200" x2="755" y2="200" stroke="#888888" stroke-width="1" stroke-dasharray="3,3"/>

<path d="M294 230 L106 230" class="msgR" marker-end="url(#mGo)"/>
<text x="197" y="220" class="mlab">Annonce de l'escalade</text>

<path d="M306 270 L494 270" class="msg" marker-end="url(#mM)"/>
<text x="400" y="260" class="mlab">Rechercher un conseiller disponible</text>

<path d="M494 310 L306 310" class="msgR" marker-end="url(#mGo)"/>
<text x="400" y="300" class="mlab">Statut des disponibilités</text>

<!-- ===================== NOTE (Parfaitement alignée et aérée) ===================== -->
<path d="M755 150 L1060 150 L1075 165 L1075 250 L755 250 Z" class="callout" filter="url(#ds)"/>
<path d="M1060 150 L1060 165 L1075 165 Z" class="fold"/>
<text x="765" y="172" class="ctb">Dossier d'escalade</text>
<text x="765" y="194" class="ct">Chaque transfert ou rappel transmet</text>
<text x="765" y="208" class="ct">au conseiller le dossier complet :</text>
<text x="765" y="222" class="ct">demande exprimée, opérations tentées</text>
<text x="765" y="236" class="ct">et verdicts rendus.</text>

<!-- ===================== MAIN ALT FRAME ===================== -->
<rect x="60" y="360" width="1120" height="740" class="frag"/>
<path d="M60,360 L115,360 L130,375 L60,375 Z" class="ftab"/>
<text x="70" y="372" class="fword">alt</text>
<text x="140" y="373" class="fcond">[ Un conseiller est disponible ]</text>

<line x1="60" y1="620" x2="1180" y2="620" class="sep"/>
<text x="70" y="640" class="fcond">[ Aucun conseiller disponible ou transfert échoué ]</text>

<!-- ========== ALT 1 : CONSEILLER DISPONIBLE ========== -->
<path d="M306 410 L494 410" class="msg" marker-end="url(#mM)"/>
<text x="400" y="400" class="mlab">Réserver le conseiller</text>

<path d="M494 450 L306 450" class="msgR" marker-end="url(#mGo)"/>
<text x="400" y="440" class="mlab">Confirmation de réservation</text>

<path d="M306 490 L1134 490" class="msg" marker-end="url(#mM)"/>
<text x="720" y="480" class="mlab">Transférer l'appel et remettre le dossier</text>

<path d="M1134 530 L306 530" class="msgR" marker-end="url(#mGo)"/>
<text x="720" y="520" class="mlab">Prise en charge de la conversation</text>

<path d="M294 570 L106 570" class="msgR" marker-end="url(#mGo)"/>
<text x="197" y="560" class="mlab">Appel connecté au conseiller</text>

<!-- ========== ALT 2 : RAPPEL PLANIFIÉ ========== -->
<path d="M306 670 L494 670" class="msg" marker-end="url(#mM)"/>
<text x="400" y="660" class="mlab">Obtenir les prochains créneaux réels</text>

<path d="M494 710 L306 710" class="msgR" marker-end="url(#mGo)"/>
<text x="400" y="700" class="mlab">Liste des créneaux disponibles</text>

<path d="M294 750 L106 750" class="msgR" marker-end="url(#mGo)"/>
<text x="197" y="740" class="mlab">Proposer des créneaux de rappel</text>

<path d="M100 790 L294 790" class="msg" marker-end="url(#mM)"/>
<text x="197" y="780" class="mlab">Choix d'un créneau</text>

<path d="M306 830 L714 830" class="msg" marker-end="url(#mM)"/>
<text x="510" y="820" class="mlab">Créer un ticket de rappel</text>

<path d="M714 870 L306 870" class="msgR" marker-end="url(#mGo)"/>
<text x="510" y="860" class="mlab">Confirmation du ticket</text>

<path d="M306 910 L934 910" class="msg" marker-end="url(#mM)"/>
<text x="620" y="900" class="mlab">Notifier le conseiller assigné</text>

<path d="M934 950 L306 950" class="msgR" marker-end="url(#mGo)"/>
<text x="620" y="940" class="mlab">Confirmation d'envoi</text>

<!-- Interactions avec le Conseiller -->
<path d="M946 990 L1134 990" class="msg" marker-end="url(#mM)"/>
<text x="1040" y="980" class="mlab">Avis de rappel planifié</text>

<path d="M1134 1030 L946 1030" class="msgR" marker-end="url(#mGo)"/>
<text x="1040" y="1020" class="mlab">Accusé de réception du dossier</text>

<path d="M294 1070 L106 1070" class="msgR" marker-end="url(#mGo)"/>
<text x="197" y="1060" class="mlab">Confirmation orale de l'horaire retenu</text>

<!-- ===================== BOTTOM PARTICIPANTS ===================== -->
<text x="100" y="1126" class="plab">Client</text>
<text x="100" y="1140" class="pst">&lt;&lt;Actor&gt;&gt;</text>
<g class="act" filter="url(#ds)">
<circle cx="100" cy="1154" r="8" fill="#FFF6C7"/>
<path d="M100 1162 L100 1187"/><path d="M86 1169 L114 1169"/><path d="M100 1187 L87 1203"/><path d="M100 1187 L113 1203"/>
</g>

<text x="300" y="1140" class="pst">&lt;&lt;Orchestrateur&gt;&gt;</text>
<rect x="215" y="1154" width="170" height="34" class="pB" filter="url(#ds)"/>
<text x="300" y="1171" class="bname">Agent de Supervision</text>

<text x="500" y="1140" class="pst">&lt;&lt;Availability&gt;&gt;</text>
<rect x="415" y="1154" width="170" height="34" class="pG" filter="url(#ds)"/>
<text x="500" y="1171" class="bname">Service de Routage</text>

<text x="720" y="1140" class="pst">&lt;&lt;External System&gt;&gt;</text>
<rect x="635" y="1154" width="170" height="34" class="pB" filter="url(#ds)"/>
<text x="720" y="1171" class="bname">Système de Tickets</text>

<text x="940" y="1140" class="pst">&lt;&lt;External System&gt;&gt;</text>
<rect x="855" y="1154" width="170" height="34" class="pG" filter="url(#ds)"/>
<text x="940" y="1171" class="bname">Service de Notification</text>

<text x="1140" y="1126" class="plab">Conseiller</text>
<text x="1140" y="1140" class="pst">&lt;&lt;Actor&gt;&gt;</text>
<g class="act" filter="url(#ds)">
<circle cx="1140" cy="1154" r="8" fill="#FFF6C7"/>
<path d="M1140 1162 L1140 1187"/><path d="M1126 1169 L1154 1169"/><path d="M1140 1187 L1127 1203"/><path d="M1140 1187 L1153 1203"/>
</g>

</svg>
