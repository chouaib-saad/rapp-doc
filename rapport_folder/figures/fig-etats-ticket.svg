<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="30 30 1290 560" width="1290" height="560">
<style><![CDATA[
.nn{font-size:12.5px;font-weight:600;fill:#111111;text-anchor:middle;font-family:Arial,Helvetica,sans-serif}
.ed{font-size:11.5px;font-weight:600;fill:#333333;text-anchor:middle;paint-order:stroke;stroke:#FFFFFF;stroke-width:3.4;stroke-linejoin:round;font-family:Arial,Helvetica,sans-serif}
.es{font-size:11.5px;font-weight:600;fill:#333333;paint-order:stroke;stroke:#FFFFFF;stroke-width:3.4;stroke-linejoin:round;font-family:Arial,Helvetica,sans-serif}
.nd{stroke:#333333;stroke-width:1.2}
.fl{fill:none;stroke:#333333;stroke-width:1.3}
.ln{fill:none;stroke:#333333;stroke-width:1.2;stroke-dasharray:7,5}
.sl{font-size:16px;font-weight:790;fill:#111111;text-anchor:middle;font-family:Arial,Helvetica,sans-serif}
.sb{font-size:11.5px;font-weight:500;fill:#444444;text-anchor:middle;font-family:Arial,Helvetica,sans-serif}
.nt{font-size:11.5px;font-weight:500;fill:#333333;text-anchor:middle;font-family:Arial,Helvetica,sans-serif}
]]></style>

<defs>
<marker id="fa" viewBox="0 0 10 10" refX="9.6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
</marker>
</defs>

<rect x="30" y="30" width="1290" height="560" fill="#FFFFFF"/>
<!-- ===================== ÉTATS ===================== -->

<!-- État initial -->
<circle cx="120" cy="150" r="11" fill="#333333"/>

<!-- Cycle de vie du ticket -->
<rect class="nd" x="200" y="124" width="150" height="52" rx="12" ry="12" fill="#96D5F2"/>
<text class="nn" x="275" y="156">Ouvert</text>

<rect class="nd" x="460" y="124" width="210" height="52" rx="12" ry="12" fill="#96D5F2"/>
<text class="nn" x="565" y="146">En cours</text>
<text class="nn" x="565" y="162">de traitement</text>

<rect class="nd" x="810" y="124" width="150" height="52" rx="12" ry="12" fill="#96D5F2"/>
<text class="nn" x="885" y="156">Résolu</text>

<rect class="nd" x="1080" y="124" width="150" height="52" rx="12" ry="12" fill="#CDF2CD"/>
<text class="nn" x="1155" y="156">Clôturé</text>

<!-- État d'attente -->
<rect class="nd" x="460" y="330" width="210" height="52" rx="12" ry="12" fill="#96D5F2"/>
<text class="nn" x="565" y="362">En attente</text>

<!-- État final -->
<circle class="nd" cx="1285" cy="150" r="13" fill="#FFFFFF"/>
<circle cx="1285" cy="150" r="7.5" fill="#333333"/>

<!-- ===================== TRANSITIONS ===================== -->

<!-- Entrée -->
<polyline class="fl" points="131,150 200,150" marker-end="url(#fa)"/>
<text class="ed" x="165" y="142">création</text>

<!-- Chemin nominal -->
<polyline class="fl" points="350,150 460,150" marker-end="url(#fa)"/>
<text class="ed" x="405" y="142">prise en charge</text>

<polyline class="fl" points="670,150 810,150" marker-end="url(#fa)"/>
<text class="ed" x="740" y="142">résolution apportée</text>

<polyline class="fl" points="960,150 1080,150" marker-end="url(#fa)"/>
<text class="ed" x="1020" y="142">clôture</text>

<polyline class="fl" points="1230,150 1272,150" marker-end="url(#fa)"/>

<!-- Mise en attente -->
<polyline class="fl" points="520,176 520,330" marker-end="url(#fa)"/>
<text class="ed" x="585" y="246">attente d'un</text>
<text class="ed" x="585" y="262">élément externe</text>

<!-- Reprise du traitement -->
<polyline class="fl" points="650,330 650,176" marker-end="url(#fa)"/>
<text class="ed" x="662" y="253" transform="rotate(-90 662 253)">élément reçu</text>

<!-- Réouverture -->
<polyline class="fl" points="885,124 885,70 565,70 565,124" marker-end="url(#fa)"/>
<text class="ed" x="725" y="62">réouverture</text>

<!-- ===================== NOTE ===================== -->
<rect class="ln" x="250" y="470" width="900" height="76" rx="10" ry="10" fill="#F7F7F7"/>
<text class="nt" x="700" y="500">Le vocabulaire d'états est celui du système de référence de l'organisation. La plateforme traduit les codes de ce</text>
<text class="nt" x="700" y="520">système vers ces cinq états, et cette traduction est le seul point où les deux vocabulaires se rencontrent.</text>
</svg>
