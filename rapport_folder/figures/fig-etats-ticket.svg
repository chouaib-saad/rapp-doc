<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="36 51 775 659" width="775" height="659">
<style><![CDATA[
text{font-family:Arial,Helvetica,sans-serif}
.ti{font-size:17px;font-weight:800;fill:#111111;text-anchor:middle}
.sn{font-size:12.5px;font-weight:750;fill:#111111;text-anchor:middle}
.sdc{font-size:11.5px;fill:#222222;text-anchor:middle}
.gu{font-size:11px;fill:#333333;text-anchor:middle;paint-order:stroke;stroke:#FFFFFF;stroke-width:3.4;stroke-linejoin:round}
.gs{font-size:11px;fill:#333333;paint-order:stroke;stroke:#FFFFFF;stroke-width:3.4;stroke-linejoin:round}
.ge{font-size:11px;fill:#333333;text-anchor:end;paint-order:stroke;stroke:#FFFFFF;stroke-width:3.4;stroke-linejoin:round}
.gl{font-size:10.5px;fill:#333333;text-anchor:end;paint-order:stroke;stroke:#FFFFFF;stroke-width:3.4;stroke-linejoin:round}
.st{stroke:#333333;stroke-width:1.5}
.sh{fill:#D0D0D0;opacity:0.55}
.sep{stroke:#333333;stroke-width:1.3}
.tr{fill:none;stroke:#333333;stroke-width:1.5}
]]></style>
<defs>
<marker id="ta" viewBox="0 0 10 10" refX="9.6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
</marker>
</defs>
<rect x="36" y="51" width="775" height="659" fill="#FFFFFF"/>


<!-- ===================== TRANSITIONS ===================== -->

<!-- initial -> Nouveau -->
<line class="tr" x1="400" y1="77" x2="400" y2="103" marker-end="url(#ta)"/>

<!-- Nouveau -> En cours de traitement -->
<line class="tr" x1="400" y1="165" x2="400" y2="225" marker-end="url(#ta)"/>
<text class="gs" x="410" y="198">prise en charge</text>

<!-- En cours de traitement -> En attente (aller) -->
<polyline class="tr" points="510,240 630,240" marker-end="url(#ta)"/>
<text class="gu" x="570" y="227">information manquante</text>

<!-- En attente -> En cours de traitement (retour) -->
<polyline class="tr" points="630,285 510,285" marker-end="url(#ta)"/>
<text class="gu" x="570" y="303">information reçue</text>

<!-- En cours de traitement -> Résolu -->
<line class="tr" x1="400" y1="300" x2="400" y2="420" marker-end="url(#ta)"/>
<text class="gs" x="410" y="365">résolution apportée</text>

<!-- Résolu -> En cours de traitement (réouverture, boucle latérale gauche) -->
<polyline class="tr" points="330,440 170,440 170,262.5 290,262.5" marker-end="url(#ta)"/>
<text class="ge" x="145" y="347">réouverture</text>
<text class="gl" x="160" y="363">[client non satisfait]</text>


<!-- Résolu -> Fermé -->
<line class="tr" x1="400" y1="490" x2="400" y2="590" marker-end="url(#ta)"/>
<text class="gs" x="410" y="530">confirmation ou</text>
<text class="gs" x="410" y="545">délai écoulé</text>

<!-- Fermé -> final -->
<line class="tr" x1="400" y1="655" x2="400" y2="679" marker-end="url(#ta)"/>

<!-- ===================== PSEUDO-ÉTAT INITIAL ===================== -->
<circle cx="400" cy="68" r="9" fill="#111111"/>

<!-- ===================== ÉTATS ===================== -->

<!-- Nouveau -->
<rect class="sh" x="323" y="103" width="160" height="65" rx="8"/>
<rect class="st" x="320" y="100" width="160" height="65" rx="8" fill="#96D5F2"/>
<line class="sep" x1="320" y1="122" x2="480" y2="122"/>
<text class="sn" x="400" y="116">Nouveau</text>
<text class="sdc" x="400" y="141">Ticket enregistré</text>

<!-- En cours de traitement -->
<rect class="sh" x="293" y="228" width="220" height="75" rx="8"/>
<rect class="st" x="290" y="225" width="220" height="75" rx="8" fill="#96D5F2"/>
<line class="sep" x1="290" y1="250" x2="510" y2="250"/>
<text class="sn" x="400" y="244">En cours de traitement</text>
<text class="sdc" x="400" y="270">Prise en charge active</text>

<!-- En attente -->
<rect class="sh" x="633" y="228" width="170" height="75" rx="8"/>
<rect class="st" x="630" y="225" width="170" height="75" rx="8" fill="#FCFBD9"/>
<line class="sep" x1="630" y1="250" x2="800" y2="250"/>
<text class="sn" x="715" y="244">En attente</text>
<text class="sdc" x="715" y="270">Attente d'information</text>

<!-- Résolu -->
<rect class="sh" x="333" y="423" width="140" height="70" rx="8"/>
<rect class="st" x="330" y="420" width="140" height="70" rx="8" fill="#96D5F2"/>
<line class="sep" x1="330" y1="445" x2="470" y2="445"/>
<text class="sn" x="400" y="439">Résolu</text>
<text class="sdc" x="400" y="464">Solution proposée</text>

<!-- Fermé -->
<rect class="sh" x="333" y="593" width="140" height="65" rx="8"/>
<rect class="st" x="330" y="590" width="140" height="65" rx="8" fill="#CDF2CD"/>
<line class="sep" x1="330" y1="612" x2="470" y2="612"/>
<text class="sn" x="400" y="606">Fermé</text>
<text class="sdc" x="400" y="631">Ticket clôturé</text>

<!-- ===================== PSEUDO-ÉTAT FINAL ===================== -->
<circle cx="400" cy="690" r="11" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
<circle cx="400" cy="690" r="6.5" fill="#111111"/>

</svg>
