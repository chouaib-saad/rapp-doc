<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="614" viewBox="0 0 1024 614">
<rect width="1024" height="614" fill="#FFFFFF"/>
<defs>
<style>
text{font-family:Arial,Helvetica,sans-serif;}
.pname{font-size:12px;font-weight:bold;fill:#111111;text-anchor:middle;}
.ptitle{font-size:13px;font-weight:bold;fill:#111111;text-anchor:middle;}
.edge{font-size:12px;fill:#333333;text-anchor:middle;}
.fold{stroke:#333333;stroke-width:1.2;}
.wire{fill:none;stroke:#333333;stroke-width:1.2;stroke-dasharray:5,4;}
.arrow{fill:none;stroke:#333333;stroke-width:1.2;}
.shadow{fill:#D0D0D0;opacity:0.55;}
</style>
</defs>

