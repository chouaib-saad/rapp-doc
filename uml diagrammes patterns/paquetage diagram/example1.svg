        font-family: Arial, Helvetica, sans-serif;
        font-size: 12px;
        font-weight: 600;
        fill: #404040;
      }

      .relation-label-blue {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 12px;
        font-weight: 600;
        fill: #6a6a6a;
      }

      .tiny-x {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 16px;
        font-weight: 700;
        fill: #4ea5dc;
      }
