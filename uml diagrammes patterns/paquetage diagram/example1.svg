    <!-- BLACK RELATION ARROW                                      -->
    <!-- ========================================================= -->

    <marker id="blackArrow"
            viewBox="0 0 10 10"
            refX="8.5"
            refY="5"
            markerWidth="8"
            markerHeight="8"
            orient="auto"
            markerUnits="userSpaceOnUse">
      <path d="M 0 0
               L 10 5
               L 0 10
               Z"
            fill="#111111"/>
    </marker>


    <!-- ========================================================= -->
    <!-- BLUE RELATION ARROW                                       -->
    <!-- ========================================================= -->

    <marker id="blueArrow"
            viewBox="0 0 10 10"
            refX="8.5"
            refY="5"
            markerWidth="8"
            markerHeight="8"
            orient="auto"
            markerUnits="userSpaceOnUse">
      <path d="M 0 0
               L 10 5
               L 0 10
               Z"
            fill="#4ea5dc"/>
    </marker>


    <!-- ========================================================= -->
    <!-- BLUE DOWNWARD ARROW                                       -->
    <!-- ========================================================= -->

