<svg xmlns="http://www.w3.org/2000/svg" width="860" height="620" viewBox="0 0 860 620">
<rect width="860" height="620" fill="#FFFFFF"/>
<defs>
<style>
text{font-family:Arial,Helvetica,sans-serif;}
.btitle{font-size:16px;font-weight:bold;fill:#111111;text-anchor:middle;}
.ucname{font-size:12px;fill:#222222;text-anchor:middle;}
.actor{font-size:12px;fill:#333333;text-anchor:middle;}
.edge{font-size:11px;fill:#222222;text-anchor:middle;}
.stereo{font-size:11px;fill:#222222;text-anchor:middle;}
.bound{fill:none;stroke:#111111;stroke-width:1.5;}
.uc{fill:#FFFBCC;stroke:#D02A50;stroke-width:1.3;}
.act{fill:none;stroke:#D02A50;stroke-width:1.7;}
.sys{fill:#FFFFFF;stroke:#D02A50;stroke-width:1.3;}
.lB{fill:none;stroke:#2B3BE0;stroke-width:1.4;}
.lK{fill:none;stroke:#2B2B2B;stroke-width:1.2;}
.lCd{fill:none;stroke:#D22B55;stroke-width:1.4;stroke-dasharray:6,4;}
</style>
<filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
<feDropShadow dx="3" dy="3" stdDeviation="2.5" flood-color="#8A8A8A" flood-opacity="0.45"/>
</filter>
<marker id="aB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#2B3BE0" stroke-width="1.3"/></marker>
<marker id="aK" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#2B2B2B" stroke-width="1.2"/></marker>
<marker id="aC" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#D22B55" stroke-width="1.3"/></marker>
</defs>

<!-- ===================== SYSTEM BOUNDARY ===================== -->
<rect x="170" y="20" width="560" height="450" class="bound" filter="url(#ds)"/>
<text x="450" y="52" class="btitle">titre de diagramme</text>

<!-- ===================== ACTOR: Client ===================== -->
<g class="act" filter="url(#ds)">
<circle cx="70" cy="205" r="7.5" fill="#FFF6C7"/>
<path d="M70 212 L70 233"/><path d="M57 219 L83 219"/><path d="M70 233 L58 249"/><path d="M70 233 L82 249"/>
</g>
<text x="70" y="268" class="actor">Client</text>

<!-- ===================== USE CASES ===================== -->
<ellipse cx="350" cy="240" rx="95" ry="32" class="uc" filter="url(#ds)"/>
<text x="350" y="234" class="ucname">Exécuter une</text>
<text x="350" y="252" class="ucname">opération sensible</text>

<ellipse cx="615" cy="95" rx="92" ry="26" class="uc" filter="url(#ds)"/>
<text x="615" y="99" class="ucname">Vérifier l'identité</text>

<ellipse cx="630" cy="195" rx="92" ry="30" class="uc" filter="url(#ds)"/>
<text x="630" y="189" class="ucname">Évaluer les</text>
<text x="630" y="207" class="ucname">règles métier</text>

<ellipse cx="630" cy="295" rx="92" ry="30" class="uc" filter="url(#ds)"/>
<text x="630" y="289" class="ucname">Consigner</text>
<text x="630" y="307" class="ucname">l'opération</text>

<ellipse cx="630" cy="395" rx="92" ry="26" class="uc" filter="url(#ds)"/>
<text x="630" y="399" class="ucname">Refuser l'opération</text>

<ellipse cx="300" cy="415" rx="92" ry="30" class="uc" filter="url(#ds)"/>
<text x="300" y="409" class="ucname">Transmettre à</text>
<text x="300" y="427" class="ucname">un conseiller</text>

<!-- ===================== EXTERNAL SYSTEM ===================== -->
<rect x="330" y="540" width="260" height="52" class="sys" filter="url(#ds)"/>
<text x="460" y="561" class="stereo">&#171; système &#187;</text>
<text x="460" y="579" class="ucname">Systèmes métier de l'opérateur</text>

<!-- ===================== RELATIONS ===================== -->
<!-- Client -> Exécuter (blue) -->
<path d="M90 220 L253 234" class="lB" marker-end="url(#aB)"/>

<!-- include: Vérifier l'identité -->
<path d="M415 214 L525 108" class="lCd" marker-end="url(#aC)"/>
<text x="470" y="150" class="edge">&#171; include &#187;</text>

<!-- include: Évaluer les règles métier -->
<path d="M445 230 L540 200" class="lCd" marker-end="url(#aC)"/>
<text x="492" y="203" class="edge">&#171; include &#187;</text>

<!-- include: Consigner l'opération -->
<path d="M442 255 L540 285" class="lCd" marker-end="url(#aC)"/>
<text x="492" y="262" class="edge">&#171; include &#187;</text>

<!-- extend: Transmettre à un conseiller -->
<path d="M315 386 L330 276" class="lCd" marker-end="url(#aC)"/>
<text x="287" y="332" class="edge">&#171; extend &#187;</text>

<!-- extend: Refuser l'opération -->
<path d="M555 378 L432 270" class="lCd" marker-end="url(#aC)"/>
<text x="500" y="332" class="edge">&#171; extend &#187;</text>

<!-- Système -> Exécuter (black elbow) -->
<path d="M460 540 L460 310 L380 310 L380 276" class="lK" marker-end="url(#aK)"/>
</svg>