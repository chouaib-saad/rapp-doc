<text x="168" y="335" class="aname">&lt;&lt;artifact&gt;&gt;</text>
<text x="173" y="350" class="aname">IMS.jar</text>
<!-- dashed dependency IMS.jar -> ORM.jar -->
<path d="M173 356 L173 384" class="dash"/>
<path d="M168 384 L173 392 L178 384" class="arrow"/>
<rect x="118" y="392" width="110" height="38" class="art"/>
<g transform="translate(211,396)"><path d="M0 0 h7 l4 4 v9 h-11 z" fill="#FFFFFF" stroke="#222222" stroke-width="1"/><path d="M7 0 v4 h4" fill="none" stroke="#222222" stroke-width="1"/></g>
<text x="168" y="407" class="aname">&lt;&lt;artifact&gt;&gt;</text>
<text x="173" y="422" class="aname">ORM.jar</text>

<!-- ===================== NODE: DB Server (orange 3D) ===================== -->
<polygon points="367,355 377,345 567,345 557,355" fill="#FBCF9F" class="face"/>
<polygon points="557,355 567,345 567,455 557,465" fill="#F29A4B" class="face"/>
<rect x="367" y="355" width="190" height="110" fill="#F9B26A" class="face"/>
<text x="462" y="376" class="stereo">&lt;&lt;device&gt;&gt;</text>
<text x="462" y="393" class="nname">DB Server</text>
<rect x="397" y="420" width="140" height="36" class="art"/>
<g transform="translate(520,424)"><path d="M0 0 h7 l4 4 v9 h-11 z" fill="#FFFFFF" stroke="#222222" stroke-width="1"/><path d="M7 0 v4 h4" fill="none" stroke="#222222" stroke-width="1"/></g>
<text x="462" y="435" class="aname">&lt;&lt;artifact&gt;&gt;</text>
<text x="467" y="450" class="aname">MySQL Server</text>
</svg>