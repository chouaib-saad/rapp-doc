<svg viewBox="0 0 2300 1160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <polygon points="0,0.5 10,5.5 0,10.5" fill="#666666"/>
    </marker>
  </defs>

  <style>
    .bg { fill: #f6f7fa; }
    .bar { fill: #f6f7fa; stroke: #666666; stroke-width: 2; }
    .box { fill: #fcfcfd; stroke: #555555; stroke-width: 2; }
    .line { stroke: #666666; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .dashed { stroke: #666666; stroke-width: 2; fill: none; stroke-dasharray: 12 9; }
    .h1 { font-family: 'Segoe UI', 'DejaVu Sans', Verdana, sans-serif; font-size: 29px; font-weight: 700; fill: #111111; text-anchor: middle; dominant-baseline: middle; }
    .h2 { font-family: 'Segoe UI', 'DejaVu Sans', Verdana, sans-serif; font-size: 27px; font-weight: 700; fill: #111111; text-anchor: middle; dominant-baseline: middle; }
    .sub { font-family: 'Segoe UI', 'DejaVu Sans', Verdana, sans-serif; font-size: 22px; fill: #222222; text-anchor: middle; dominant-baseline: middle; }
    .lbl { font-family: 'Segoe UI', 'DejaVu Sans', Verdana, sans-serif; font-size: 24px; fill: #111111; text-anchor: middle; dominant-baseline: middle; }
  </style>

  <rect class="bg" width="2300" height="1160"/>

  <!-- Top / bottom bars -->
  <rect x="15" y="20" width="2270" height="75" class="bar"/>
  <text x="1150" y="60" class="h1">Orchestration</text>
  <rect x="15" y="1085" width="2270" height="75" class="bar"/>
  <text x="1150" y="1125" class="h1">Logging, monitoring, and analytics</text>

  <!-- ================= CONNECTIONS ================= -->
  <!-- User -> Cache (Query) -->
  <path d="M 153 600 L 316 600" class="line" marker-end="url(#arrow)"/>
  <text x="230" y="567" class="lbl">Query</text>

  <!-- Dashed cached response to user -->
  <path d="M 447 470 L 105 470 L 105 538" class="dashed" marker-end="url(#arrow)"/>
  <text x="275" y="452" class="lbl">Cached response</text>

  <!-- Cache -> up -> Context construction -->
  <path d="M 447 540 L 447 205 L 786 205" class="line" marker-end="url(#arrow)"/>

  <!-- Final response feedback vertical into top line -->
  <path d="M 745 940 L 745 205" class="line"/>

  <!-- Context -> Input guardrails -->
  <path d="M 1235 207 L 1331 207" class="line" marker-end="url(#arrow)"/>

  <!-- Input guardrails -> Model gateway -->
  <path d="M 1705 205 L 2020 205 L 2020 306" class="line" marker-end="url(#arrow)"/>

  <!-- small Cache -> Context -->
  <path d="M 1017 330 L 1017 289" class="line" marker-end="url(#arrow)"/>

  <!-- Read-only -> small Cache -->
  <path d="M 1017 440 L 1017 404" class="line" marker-end="url(#arrow)"/>

  <!-- Databases -> small Cache -->
  <path d="M 1500 435 L 1500 360 L 1114 360" class="line" marker-end="url(#arrow)"/>

  <!-- Model gateway -> Output guardrails -->
  <path d="M 2020 800 L 2020 940 L 1699 940" class="line" marker-end="url(#arrow)"/>

  <!-- Final response line back to user -->
  <path d="M 1330 940 L 105 940 L 105 662" class="line" marker-end="url(#arrow)"/>
  <text x="575" y="978" class="lbl">Final response</text>

  <!-- branch up into left Cache -->
  <path d="M 447 940 L 447 664" class="line" marker-end="url(#arrow)"/>

  <!-- branch up into Write Actions -->
  <path d="M 1017 940 L 1017 844" class="line" marker-end="url(#arrow)"/>

  <!-- ================= NODES ================= -->

  <!-- User smiley -->
  <circle cx="105" cy="600" r="48" fill="#d9d9d9" stroke="#444444" stroke-width="2"/>
  <circle cx="88" cy="588" r="5" fill="#888888"/>
  <circle cx="122" cy="588" r="5" fill="#888888"/>
  <path d="M 82 615 Q 105 632 128 615" fill="none" stroke="#888888" stroke-width="2.5"/>

  <!-- left Cache -->
  <rect x="330" y="540" width="235" height="110" class="box"/>
  <text x="447" y="600" class="h1">Cache</text>

  <!-- Context construction -->
  <rect x="800" y="140" width="435" height="135" class="box"/>
  <text x="1017" y="177" class="h1">Context construction</text>
  <text x="1017" y="212" class="sub">e.g. RAG, agent,</text>
  <text x="1017" y="245" class="sub">query rewriting</text>

  <!-- Input guardrails -->
  <rect x="1345" y="155" width="360" height="100" class="box"/>
  <text x="1525" y="192" class="h1">Input guardrails</text>
  <text x="1525" y="227" class="sub">e.g. PII redaction</text>

  <!-- small Cache -->
  <rect x="935" y="330" width="165" height="60" class="box"/>
  <text x="1017" y="362" class="h1">Cache</text>

  <!-- Read-only Actions -->
  <rect x="820" y="440" width="395" height="165" rx="25" class="box"/>
  <text x="1017" y="478" class="h1">Read-only Actions</text>
  <text x="1017" y="513" class="sub">e.g. vector search,</text>
  <text x="1017" y="546" class="sub">run SQL queries,</text>
  <text x="1017" y="579" class="sub">web search</text>

  <!-- Databases cylinder -->
  <path d="M 1340 470 L 1340 610 A 162 35 0 0 0 1665 610 L 1665 470" class="box"/>
  <ellipse cx="1502" cy="470" rx="162" ry="35" class="box"/>
  <text x="1502" y="512" class="h1">Databases</text>
  <text x="1502" y="547" class="sub">e.g. documents,</text>
  <text x="1502" y="580" class="sub">tables, chat history,</text>
  <text x="1502" y="613" class="sub">vectorDB</text>

  <!-- Write Actions -->
  <rect x="820" y="695" width="395" height="135" rx="25" class="box"/>
  <text x="1017" y="732" class="h1">Write Actions</text>
  <text x="1017" y="767" class="sub">e.g. update orders,</text>
  <text x="1017" y="800" class="sub">send emails</text>

  <!-- Output guardrails -->
  <rect x="1330" y="875" width="355" height="135" class="box"/>
  <text x="1507" y="912" class="h1">Output guardrails</text>
  <text x="1507" y="947" class="sub">- Safety/verification</text>
  <text x="1507" y="980" class="sub">- Structured outputs</text>

  <!-- Model gateway -->
  <rect x="1810" y="320" width="425" height="480" class="box"/>
  <text x="2022" y="367" class="h1">Model gateway</text>
  <text x="2022" y="402" class="sub">Model catalog, access</text>
  <text x="2022" y="435" class="sub">token management, ...</text>
  <rect x="1845" y="490" width="345" height="80" class="box"/>
  <text x="2017" y="532" class="h2">Routing</text>
  <rect x="1845" y="590" width="345" height="80" class="box"/>
  <text x="2017" y="632" class="h2">Generation</text>
  <rect x="1845" y="690" width="345" height="80" class="box"/>
  <text x="2017" y="732" class="h2">Scoring</text>
</svg>