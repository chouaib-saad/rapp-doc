<svg viewBox="0 0 997 997" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="ga" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse">
      <polygon points="0,0.5 8,4 0,7.5" fill="#666666"/>
    </marker>
    <!-- small vertical "cycle" double-arrow glyph -->
    <g id="cyc">
      <path d="M -4 -14 C 8 -10 8 -4 4 2" fill="none" stroke="#777" stroke-width="1.2" marker-end="url(#ga)"/>
      <path d="M 4 14 C -8 10 -8 4 -4 -2" fill="none" stroke="#777" stroke-width="1.2" marker-end="url(#ga)"/>
    </g>
  </defs>

  <style>
    .bg{fill:#edeff3;}
    .blue-box{fill:#b9d4f1;stroke:#333333;stroke-width:1.3;}
    .white-box{fill:#f7f8fa;stroke:#333333;stroke-width:1.2;}
    .yellow-box{fill:#f8ec8e;stroke:#333333;stroke-width:1.2;}
    .pink-cyl{fill:#f6cdd4;stroke:#8b4049;stroke-width:1.4;}
    .green-box{fill:#a9e7a0;stroke:#333333;stroke-width:1.2;}
    .llm-box{fill:#4caf50;stroke:#222222;stroke-width:1.4;}
    .pill{fill:#f5d33d;stroke:#333333;stroke-width:1.3;}
    .tan-box{fill:#f2d6a7;stroke:#333333;stroke-width:1.2;}
    .teal-badge{fill:#17a589;stroke:#222222;stroke-width:1.2;}
    .orange-badge{fill:#e67e22;stroke:#222222;stroke-width:1.2;}
    .dline{stroke:#7a7a7a;stroke-width:1.1;fill:none;marker-start:url(#ga);marker-end:url(#ga);}
    .sline{stroke:#7a7a7a;stroke-width:1.1;fill:none;marker-end:url(#ga);}
    .t{font-family:Verdana,'DejaVu Sans',sans-serif;font-size:12px;font-weight:bold;fill:#111111;text-anchor:middle;dominant-baseline:middle;}
    .tb{font-family:Verdana,'DejaVu Sans',sans-serif;font-size:13px;font-weight:bold;fill:#1878d6;text-anchor:middle;dominant-baseline:middle;}
    .ts{font-family:Verdana,'DejaVu Sans',sans-serif;font-size:9.5px;fill:#111111;text-anchor:middle;dominant-baseline:middle;}
    .tl{font-family:Verdana,'DejaVu Sans',sans-serif;font-size:13px;fill:#111111;}
    .tbx{font-family:Verdana,'DejaVu Sans',sans-serif;font-size:12px;font-weight:bold;fill:#111111;text-anchor:middle;dominant-baseline:middle;}
  </style>

  <rect class="bg" width="997" height="997"/>

  <!-- ================= LONG CONNECTORS ================= -->
  <path d="M 168 145 L 228 127" class="dline"/>
  <path d="M 120 199 L 80 408" class="dline"/>
  <path d="M 143 515 L 231 515" class="dline"/>
  <path d="M 82 600 L 231 897" class="dline"/>
  <path d="M 554 395 L 654 283" class="dline"/>
  <path d="M 554 418 L 654 650" class="dline"/>
  <path d="M 554 662 L 654 372" class="dline"/>
  <path d="M 554 678 L 654 756" class="dline"/>

  <!-- ================= LEFT : SHARED MEMORY ================= -->
  <path d="M 14 440 L 14 575 A 64.5 25 0 0 0 143 575 L 143 440" class="pink-cyl"/>
  <ellipse cx="78.5" cy="440" rx="64.5" ry="25" class="pink-cyl"/>
  <text x="78" y="527" class="tb">Shared memory</text>

  <!-- ================= AGENT 2 ================= -->
  <text x="230" y="22" class="tl">Agent 2</text>
  <rect x="233" y="82" width="318" height="83" class="blue-box"/>
  <text x="392" y="124" class="tb">Agent 2</text>

  <!-- Agent Collaboration callout -->
  <rect x="84" y="120" width="84" height="62" class="white-box"/>
  <polygon points="135,182 152,232 118,182" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
  <text x="126" y="146" class="ts">Agent</text>
  <text x="126" y="162" class="ts">Collaboration</text>

  <!-- cycle Agent2 <-> Agent1 -->
  <use href="#cyc" x="392" y="207"/>

  <!-- ================= AGENT 1 CONTAINER ================= -->
  <text x="237" y="228" class="tl">Agent 1</text>
  <rect x="233" y="255" width="330" height="527" rx="4" fill="#b9d4f1"/>

  <rect x="250" y="283" width="82" height="54" class="white-box"/>
  <text x="291" y="311" class="t">Memory</text>
  <rect x="349" y="283" width="106" height="54" class="white-box"/>
  <text x="402" y="311" class="t">Goals</text>
  <rect x="250" y="380" width="82" height="54" class="white-box"/>
  <text x="291" y="408" class="t">Reason</text>
  <rect x="349" y="380" width="106" height="54" class="yellow-box"/>
  <text x="402" y="408" class="tb">Agent 1</text>
  <rect x="472" y="380" width="82" height="54" class="white-box"/>
  <text x="513" y="408" class="t">Sense</text>
  <rect x="349" y="465" width="106" height="54" class="white-box"/>
  <text x="402" y="493" class="t">Plan</text>
  <rect x="349" y="553" width="106" height="54" class="white-box"/>
  <text x="402" y="581" class="t">Coordinate</text>
  <rect x="349" y="648" width="106" height="54" class="white-box"/>
  <text x="402" y="676" class="t">Act</text>
  <rect x="466" y="648" width="88" height="54" class="white-box"/>
  <text x="510" y="676" class="t">Tools</text>

  <!-- LLM speech bubble -->
  <rect x="256" y="480" width="55" height="105" class="llm-box"/>
  <polygon points="275,585 300,606 288,585" class="llm-box"/>
  <text x="283" y="532" class="ts" style="font-weight:bold;">LLM</text>

  <!-- inner connectors -->
  <path d="M 315 337 L 362 378" class="dline"/>
  <path d="M 402 337 L 402 378" class="dline"/>
  <path d="M 332 407 L 347 407" class="dline"/>
  <path d="M 455 407 L 470 407" class="dline"/>
  <path d="M 402 434 L 402 463" class="sline"/>
  <path d="M 402 519 L 402 551" class="sline"/>
  <path d="M 402 607 L 402 646" class="sline"/>
  <path d="M 455 675 L 464 675" class="dline"/>
  <use href="#cyc" x="289" y="457" transform="scale(1)"/>
  <path d="M 310 505 L 347 495" class="dline"/>
  <path d="M 310 555 L 347 570" class="dline"/>

  <!-- ================= AGENT 3 ================= -->
  <use href="#cyc" x="392" y="838"/>
  <text x="222" y="836" class="tl">Agent 3</text>
  <rect x="233" y="882" width="318" height="80" class="blue-box"/>
  <text x="392" y="922" class="tb">Agent 3</text>

  <!-- ================= DIGITAL BUSINESS CONTEXT ================= -->
  <rect x="658" y="30" width="173" height="42" rx="6" class="teal-badge"/>
  <text x="744" y="52" class="tbx">Digital Business Context</text>
  <rect x="658" y="82" width="307" height="400" rx="8" fill="none" stroke="#17a589" stroke-width="2" stroke-dasharray="9 7"/>

  <path d="M 688 145 L 688 190 A 72.5 20 0 0 0 833 190 L 833 145" class="pink-cyl"/>
  <ellipse cx="760.5" cy="145" rx="72.5" ry="20" class="pink-cyl"/>
  <text x="760" y="178" class="tb" style="font-size:11px;">Un-Structured Data</text>

  <path d="M 866 160 L 866 215 A 42.5 15 0 0 0 951 215 L 951 160" class="pink-cyl"/>
  <ellipse cx="908.5" cy="160" rx="42.5" ry="15" class="pink-cyl"/>
  <text x="908" y="186" class="tb" style="font-size:11px;">Vector</text>
  <text x="908" y="202" class="tb" style="font-size:11px;">Stores</text>

  <rect x="676" y="242" width="172" height="80" class="green-box"/>
  <text x="762" y="283" class="t" style="font-weight:normal;">digital business context</text>

  <path d="M 688 385 L 688 432 A 72.5 20 0 0 0 833 432 L 833 385" class="pink-cyl"/>
  <ellipse cx="760.5" cy="385" rx="72.5" ry="20" class="pink-cyl"/>
  <text x="760" y="417" class="tb" style="font-size:11px;">Knowledge Graphs</text>

  <path d="M 858 362 L 858 420 A 45 17 0 0 0 948 420 L 948 362" class="pink-cyl"/>
  <ellipse cx="903" cy="362" rx="45" ry="17" class="pink-cyl"/>
  <text x="903" y="388" class="tb" style="font-size:11px;">Structured</text>
  <text x="903" y="404" class="tb" style="font-size:11px;">Data</text>

  <use href="#cyc" x="762" y="226"/>
  <use href="#cyc" x="762" y="344"/>
  <path d="M 880 232 L 850 268" class="dline"/>
  <path d="M 872 352 L 850 312" class="dline"/>

  <!-- ================= PHYSICAL ENVIRONMENT CONTEXT ================= -->
  <rect x="658" y="518" width="208" height="42" rx="6" class="orange-badge"/>
  <text x="762" y="540" class="tbx">Physical Environment Context</text>
  <rect x="658" y="570" width="307" height="395" rx="8" fill="none" stroke="#e67e22" stroke-width="2" stroke-dasharray="9 7"/>

  <rect x="748" y="612" width="120" height="53" rx="26" class="pill"/>
  <text x="808" y="639" class="t">device 1</text>
  <use href="#cyc" x="808" y="684"/>
  <rect x="718" y="702" width="180" height="80" class="tan-box"/>
  <text x="808" y="742" class="t" style="font-weight:normal;">physical environment</text>
  <use href="#cyc" x="808" y="801"/>
  <rect x="748" y="820" width="120" height="53" rx="26" class="pill"/>
  <text x="808" y="847" class="t">device n</text>
</svg>