<svg viewBox="0 0 2650 1150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.1" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,1 10,5 0,9" fill="#333333" />
    </marker>
  </defs>

  <style>
    .bg { fill: #ffffff; }
    .box-blue { fill: #DAE8FC; stroke: #6C8EBF; stroke-width: 1.5; rx: 4; ry: 4; filter: url(#shadow); }
    .box-yellow { fill: #FFF2CC; stroke: #D6B656; stroke-width: 1.5; rx: 4; ry: 4; filter: url(#shadow); }
    .box-red { fill: #F8CECC; stroke: #B85450; stroke-width: 1.5; rx: 4; ry: 4; filter: url(#shadow); }
    .box-green { fill: #D5E8D4; stroke: #82B366; stroke-width: 1.5; rx: 4; ry: 4; filter: url(#shadow); }
    .diamond { fill: #F8CECC; stroke: #B85450; stroke-width: 1.5; filter: url(#shadow); }
    .start-node { fill: #D5E8D4; stroke: #82B366; stroke-width: 1.5; filter: url(#shadow); }
    .line { stroke: #333333; stroke-width: 1.2; fill: none; }
    .text-main { font-family: Arial, Helvetica, sans-serif; font-size: 12px; fill: #000000; text-anchor: middle; dominant-baseline: middle; }
    .text-label { font-family: Arial, Helvetica, sans-serif; font-size: 11px; fill: #333333; text-anchor: middle; }
    .text-left { font-family: Arial, Helvetica, sans-serif; font-size: 11px; fill: #333333; text-anchor: start; }
  </style>

  <rect class="bg" width="100%" height="100%" />

  <!-- Badge -->
  <rect x="20" y="20" width="120" height="40" class="box-blue" />
  <text x="80" y="40" class="text-main">Connected Mode</text>

  <!-- ================= LINES & CONNECTIONS ================= -->
  <g id="connections">
    <!-- Top Row Flow -->
    <path d="M 100 150 L 180 150" class="line" marker-end="url(#arrow)" />
    <path d="M 300 150 L 350 150" class="line" marker-end="url(#arrow)" />
    <path d="M 490 150 L 540 150" class="line" marker-end="url(#arrow)" />
    <path d="M 610 180 L 610 220" class="line" marker-end="url(#arrow)" />
    
    <!-- D1 API -->
    <path d="M 650 260 L 750 260" class="line" marker-end="url(#arrow)" />
    <path d="M 610 300 L 610 340" class="line" marker-end="url(#arrow)" />
    
    <!-- D2 Empty List -->
    <path d="M 650 380 L 750 380" class="line" marker-end="url(#arrow)" />
    <path d="M 610 420 L 610 460" class="line" marker-end="url(#arrow)" />

    <!-- Proceed Downwards -->
    <path d="M 610 520 L 610 560" class="line" marker-end="url(#arrow)" />
    <path d="M 610 620 L 610 660" class="line" marker-end="url(#arrow)" />

    <!-- Split: Cancel & Reschedule -->
    <path d="M 540 690 L 410 690 L 410 760" class="line" marker-end="url(#arrow)" />
    <path d="M 680 690 L 810 690 L 810 760" class="line" marker-end="url(#arrow)" />

    <!-- Cancel Flow -->
    <path d="M 410 820 L 410 840" class="line" marker-end="url(#arrow)" />
    <path d="M 370 880 L 300 880" class="line" marker-end="url(#arrow)" />
    <path d="M 450 880 L 520 880" class="line" marker-end="url(#arrow)" />
    <path d="M 680 880 L 730 880" class="line" marker-end="url(#arrow)" />

    <!-- Reschedule Flow -->
    <path d="M 880 790 L 1010 790" class="line" marker-end="url(#arrow)" />
    <path d="M 1050 750 L 1050 710" class="line" marker-end="url(#arrow)" />
    <path d="M 1050 830 L 1050 880" class="line" marker-end="url(#arrow)" />
    
    <!-- Date Book Vehicle Inspection Flow -->
    <path d="M 1120 910 L 1210 910" class="line" marker-end="url(#arrow)" />
    <path d="M 1250 950 L 1250 1020" class="line" marker-end="url(#arrow)" />
    <path d="M 1290 910 L 1410 910" class="line" marker-end="url(#arrow)" />
    <path d="M 1450 950 L 1450 1020" class="line" marker-end="url(#arrow)" />

    <!-- Split from D6 (CanPay) -->
    <path d="M 1450 870 L 1450 810 L 1650 810" class="line" marker-end="url(#arrow)" />
    <path d="M 1490 910 L 1570 910 L 1570 970 L 1650 970" class="line" marker-end="url(#arrow)" />

    <!-- Connect into Confirmation Flow -->
    <path d="M 1810 810 L 1860 810" class="line" marker-end="url(#arrow)" />
    <path d="M 1810 970 L 2000 970" class="line" marker-end="url(#arrow)" />
    <path d="M 1900 770 L 1900 730 L 2000 730" class="line" marker-end="url(#arrow)" />
    <path d="M 1900 850 L 1900 970" class="line" />

    <!-- Final API Calls -->
    <path d="M 2140 730 L 2210 730" class="line" marker-end="url(#arrow)" />
    <path d="M 2250 690 L 2250 660" class="line" marker-end="url(#arrow)" />
    <path d="M 2290 730 L 2400 730" class="line" marker-end="url(#arrow)" />

    <path d="M 2140 970 L 2210 970" class="line" marker-end="url(#arrow)" />
    <path d="M 2250 930 L 2250 900" class="line" marker-end="url(#arrow)" />
    <path d="M 2290 970 L 2400 970" class="line" marker-end="url(#arrow)" />
  </g>

  <!-- ================= TEXT LABELS ON LINES ================= -->
  <text x="610" y="200" class="text-label">Call /reservation/detailsByCustomer API</text>
  <text x="700" y="250" class="text-label">Failure</text>
  <text x="610" y="320" class="text-label">Success</text>
  <text x="700" y="370" class="text-label">Empty List</text>
  <text x="610" y="440" class="text-label">Filled List</text>
  <text x="610" y="540" class="text-label">OnClick Car</text>
  <text x="610" y="640" class="text-label">Proceed</text>
  
  <!-- Cancel labels -->
  <text x="410" y="830" class="text-label">Call /reservation/cancellation API</text>
  <text x="335" y="870" class="text-label">Failure</text>
  <text x="485" y="870" class="text-label">Success</text>
  <text x="705" y="870" class="text-label">Done</text>
  
  <!-- Reschedule labels -->
  <text x="945" y="780" class="text-label">Call /reservation/rescheduling API</text>
  <text x="1150" y="900" class="text-label">is Mandatory Data filled</text>
  <text x="1265" y="980" class="text-label">No</text>
  <text x="1350" y="900" class="text-label">Yes, Call /reservation/canPayOnline</text>
  <text x="1465" y="980" class="text-label">Failure</text>
  <text x="1530" y="800" class="text-label">Success ("Result false")</text>
  <text x="1560" y="890" class="text-label text-left">Success ("Result True")</text>

  <!-- Confirmation labels -->
  <text x="2175" y="720" class="text-label">Call /reservation/reservation API</text>
  <text x="2265" y="675" class="text-label">Failure</text>
  <text x="2345" y="720" class="text-label">Reservation Created</text>
  <text x="2175" y="960" class="text-label">Call /reservation/reservation API</text>
  <text x="2265" y="915" class="text-label">Failure</text>
  <text x="2345" y="960" class="text-label">Reservation Created</text>


  <!-- ================= BOXES AND DIAMONDS ================= -->
  
  <!-- Start -->
  <ellipse cx="70" cy="150" rx="30" ry="20" class="start-node" />
  
  <g transform="translate(180, 120)">
    <rect width="120" height="60" class="box-blue" />
    <text x="60" y="30" class="text-main">Home Screen</text>
  </g>

  <g transform="translate(350, 120)">
    <rect width="140" height="60" class="box-blue" />
    <text x="70" y="30" class="text-main">Fahes Menu Screen</text>
  </g>

  <g transform="translate(540, 120)">
    <rect width="140" height="60" class="box-blue" />
    <text x="70" y="22" class="text-main">Cancel/Modify</text>
    <text x="70" y="42" class="text-main">Screen</text>
  </g>

  <!-- D1: API -->
  <polygon points="610,220 650,260 610,300 570,260" class="diamond" />
  <g transform="translate(750, 230)">
    <rect width="100" height="60" class="box-red" />
    <text x="50" y="30" class="text-main">Error PopUp</text>
  </g>

  <!-- D2: List -->
  <polygon points="610,340 650,380 610,420 570,380" class="diamond" />
  <g transform="translate(750, 350)">
    <rect width="140" height="60" class="box-yellow" />
    <text x="70" y="30" class="text-main">empty list message</text>
  </g>

  <g transform="translate(540, 460)">
    <rect width="140" height="60" class="box-yellow" />
    <text x="70" y="30" class="text-main">show car credentials</text>
  </g>

  <g transform="translate(540, 560)">
    <rect width="140" height="60" class="box-blue" />
    <text x="70" y="22" class="text-main">Car Credentials</text>
    <text x="70" y="42" class="text-main">Details</text>
  </g>

  <g transform="translate(540, 660)">
    <rect width="140" height="60" class="box-yellow" />
    <text x="70" y="22" class="text-main">Show Booking Details</text>
    <text x="70" y="42" class="text-main">PopUp</text>
  </g>

  <!-- Split Left: Cancel -->
  <g transform="translate(340, 760)">
    <rect width="140" height="60" class="box-yellow" />
    <text x="70" y="30" class="text-main">Click Cancel Booking</text>
  </g>

  <polygon points="410,840 450,880 410,920 370,880" class="diamond" />
  
  <g transform="translate(200, 850)">
    <rect width="100" height="60" class="box-red" />
    <text x="50" y="30" class="text-main">Error PopUp</text>
  </g>

  <g transform="translate(520, 850)">
    <rect width="160" height="60" class="box-green" />
    <text x="80" y="22" class="text-main">Successfully cancel</text>
    <text x="80" y="42" class="text-main">booking</text>
  </g>

  <g transform="translate(730, 850)">
    <rect width="140" height="60" class="box-blue" />
    <text x="70" y="30" class="text-main">Fahes Menu Screen</text>
  </g>

  <!-- Split Right: Reschedule -->
  <g transform="translate(740, 760)">
    <rect width="140" height="60" class="box-yellow" />
    <text x="70" y="30" class="text-main">Click Reschedule</text>
  </g>

  <polygon points="1050,750 1090,790 1050,830 1010,790" class="diamond" />
  
  <g transform="translate(1000, 650)">
    <rect width="100" height="60" class="box-red" />
    <text x="50" y="30" class="text-main">Error PopUp</text>
  </g>

  <g transform="translate(980, 880)">
    <rect width="140" height="60" class="box-blue" />
    <text x="70" y="22" class="text-main">Date Book Vehicle</text>
    <text x="70" y="42" class="text-main">Inspection</text>
  </g>

  <polygon points="1250,870 1290,910 1250,950 1210,910" class="diamond" />

  <g transform="translate(1200, 1020)">
    <rect width="100" height="60" class="box-red" />
    <text x="50" y="30" class="text-main">Error PopUp</text>
  </g>

  <polygon points="1450,870 1490,910 1450,950 1410,910" class="diamond" />

  <g transform="translate(1400, 1020)">
    <rect width="100" height="60" class="box-red" />
    <text x="50" y="30" class="text-main">Error PopUp</text>
  </g>

  <!-- Confirmation Popups -->
  <g transform="translate(1650, 780)">
    <rect width="160" height="60" class="box-yellow" />
    <text x="80" y="22" class="text-main">Show PopUp without</text>
    <text x="80" y="42" class="text-main">Confirm and Pay Button</text>
  </g>

  <g transform="translate(1650, 940)">
    <rect width="160" height="60" class="box-yellow" />
    <text x="80" y="22" class="text-main">Show PopUp with</text>
    <text x="80" y="42" class="text-main">Confirm and Pay Button</text>
  </g>

  <polygon points="1900,770 1940,810 1900,850 1860,810" class="diamond" />

  <g transform="translate(2000, 700)">
    <rect width="140" height="60" class="box-yellow" />
    <text x="70" y="30" class="text-main">Click "Confirm &amp; Exit"</text>
  </g>

  <g transform="translate(2000, 940)">
    <rect width="140" height="60" class="box-yellow" />
    <text x="70" y="30" class="text-main">Click "Confirm &amp; Pay"</text>
  </g>

  <!-- Final Confirm Exit Flow -->
  <polygon points="2250,690 2290,730 2250,770 2210,730" class="diamond" />
  
  <g transform="translate(2200, 600)">
    <rect width="100" height="60" class="box-red" />
    <text x="50" y="30" class="text-main">Error PopUp</text>
  </g>

  <g transform="translate(2400, 700)">
    <rect width="140" height="60" class="box-blue" />
    <text x="70" y="30" class="text-main">Fahes Menu Screen</text>
  </g>

  <!-- Final Confirm Pay Flow -->
  <polygon points="2250,930 2290,970 2250,1010 2210,970" class="diamond" />
  
  <g transform="translate(2200, 840)">
    <rect width="100" height="60" class="box-red" />
    <text x="50" y="30" class="text-main">Error PopUp</text>
  </g>

  <g transform="translate(2400, 940)">
    <rect width="160" height="60" class="box-blue" />
    <text x="80" y="22" class="text-main">Vehicle Payment</text>
    <text x="80" y="42" class="text-main">Confirmation</text>
  </g>

</svg>
